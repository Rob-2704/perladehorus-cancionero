<!DOCTYPE html>
<html lang="es-mx">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/x-icon" href="img/icono.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sono:MONO@0..1&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0&display=swap" />

    <link href="style.css" rel="stylesheet">
    <title>Gestor de Eventos</title>
    <style>
        body {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            padding-bottom: 80px;
            font-family: 'Sono', monospace;
        }

        header {
            margin-bottom: 25px;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        h1 { margin: 0; font-size: 28px; }
        .subtitulo { margin: 5px 0 0 0; font-size: 13px; color: var(--text-sec); }

        .tarjeta-formulario {
            background-color: var(--card-bg);
            border-radius: 20px;
            border: none;
            padding: 24px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            margin-bottom: 35px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .tarjeta-formulario h2 {
            margin: 0 0 10px 0;
            font-size: 20px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .grid-campos {
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
        }

        @media (min-width: 600px) {
            .grid-campos { grid-template-columns: repeat(2, 1fr); }
            .col-full { grid-column: 1 / -1; }
        }

        .campo-grupo {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .campo-grupo label {
            font-size: 12px;
            color: var(--text-sec);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-admin, .textarea-admin {
            background-color: #121215;
            color: var(--text-main);
            border: 1px solid var(--accent);
            border-radius: 10px;
            padding: 10px 14px;
            font-family: 'Sono', monospace;
            font-size: 14px;
            outline: none;
            width: 100%;
            box-sizing: border-box;
        }

        .textarea-admin {
            resize: vertical;
            min-height: 70px;
        }

        /* Contenedor con Scroll para la lista de canciones */
        .contenedor-selector-canciones {
            background-color: #121215;
            border: 1px solid var(--accent);
            border-radius: 12px;
            padding: 12px;
            max-height: 240px;
            overflow-y: auto;
            box-sizing: border-box;
        }

        /* Grid interno para tarjetas de canciones */
        .grid-canciones-selector {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 10px;
        }

        .tarjeta-cancion-selector {
            background-color: #1a1a20;
            border: 1.5px solid rgba(188, 151, 49, 0.3);
            border-radius: 12px;
            padding: 10px 14px;
            cursor: pointer;
            font-family: 'Sono', monospace;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .tarjeta-cancion-selector:hover {
            transform: translateY(-2px);
            border-color: var(--accent);
        }

        .tarjeta-cancion-selector.seleccionada {
            background-color: #2ec4b6;
            color: #0b1315;
            border-color: #2ec4b6;
            box-shadow: 0 4px 12px rgba(46, 196, 182, 0.35);
        }

        .tarjeta-cancion-selector .icono-chk {
            font-size: 18px;
            opacity: 0;
            transition: opacity 0.15s;
        }

        .tarjeta-cancion-selector.seleccionada .icono-chk {
            opacity: 1;
        }

        .acciones-form {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 10px;
        }

        .btn-accion {
            border: none;
            padding: 10px 18px;
            border-radius: 12px;
            font-family: 'Sono', monospace;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: transform 0.15s;
        }

        .btn-accion:active { transform: scale(0.96); }
        .btn-guardar { background-color: var(--accent); color: var(--bg-color); }
        .btn-cancelar { background-color: transparent; color: var(--text-sec); border: 1px solid var(--text-sec); }

        .titulo-lista {
            font-size: 18px;
            font-weight: 600;
            margin: 25px 0 15px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Lista de Eventos centrada verticalmente */
        .lista-eventos-admin {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .tarjeta-evento-admin {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 14px 18px;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            border: 2px solid var(--accent);
            transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.15s;
            position: relative;
            flex-wrap: wrap;
        }

        .info-evento-admin {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
            min-width: 220px;
        }

        .info-evento-admin h3 {
            margin: 0 0 2px 0;
            font-size: 16px;
            font-weight: 600;
            color: var(--text-main);
        }

        .meta-evento-admin {
            display: flex;
            flex-direction: column;
            gap: 3px;
            font-size: 12px;
            color: var(--text-sec);
        }

        .meta-item-admin {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .botones-item-admin {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-shrink: 0;
        }

        .btn-mini {
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-family: 'Sono', monospace;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: transform 0.15s;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-mini:active { transform: scale(0.95); }
        .btn-editar { background-color: #2ec4b6; color: #fff; }
        .btn-eliminar { background-color: #e71d36; color: #fff; }

        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined' !important;
            font-weight: normal;
            font-style: normal;
            display: inline-block;
        }
    </style>
</head>
<body>
    <header>
        <div>
            <h1>Gestor de Eventos</h1>
            <p class="subtitulo">Rondalla Perla De Horus</p>
        </div>
    </header>

    <main>
        <!-- Formulario Crear/Editar -->
        <div class="tarjeta-formulario">
            <h2 id="titulo-form">
                <span class="material-symbols-outlined" id="icono-form">add_circle</span> Crear Nuevo Evento
            </h2>

            <form id="form-evento" onsubmit="return false;">
                <input type="hidden" id="form-id-e">

                <div class="grid-campos">
                    <div class="campo-grupo col-full">
                        <label for="form-titulo">Título del Evento *</label>
                        <input type="text" id="form-titulo" class="input-admin" required>
                    </div>

                    <div class="campo-grupo">
                        <label for="form-fecha">Fecha</label>
                        <input type="date" id="form-fecha" class="input-admin">
                    </div>

                    <div class="campo-grupo">
                        <label for="form-vestimenta">Vestimenta</label>
                        <input type="text" id="form-vestimenta" class="input-admin">
                    </div>

                    <div class="campo-grupo">
                        <label for="form-hora-inicio">Hora de inicio</label>
                        <input type="time" id="form-hora-inicio" class="input-admin">
                    </div>

                    <div class="campo-grupo">
                        <label for="form-hora-fin">Hora de término</label>
                        <input type="time" id="form-hora-fin" class="input-admin">
                    </div>

                    <div class="campo-grupo">
                        <label for="form-lugar">Lugar del evento</label>
                        <input type="text" id="form-lugar" class="input-admin">
                    </div>

                    <div class="campo-grupo">
                        <label for="form-link-lugar">Enlace Google Maps</label>
                        <input type="url" id="form-link-lugar" class="input-admin" placeholder="https://maps.google.com/...">
                    </div>

                    <div class="campo-grupo col-full">
                        <label for="form-notas">Nota</label>
                        <textarea id="form-notas" class="textarea-admin"></textarea>
                    </div>

                    <div class="campo-grupo col-full">
                        <label>Repertorio</label>
                        <div class="contenedor-selector-canciones">
                            <div id="contenedor-canciones-selector" class="grid-canciones-selector">
                                <span style="color:var(--text-sec); font-size:12px;">Cargando canciones...</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="acciones-form">
                    <button type="button" id="btn-cancelar-form" class="btn-accion btn-cancelar" style="display:none;">
                        Cancelar
                    </button>
                    <button type="button" id="btn-guardar-evento" class="btn-accion btn-guardar">
                        <span class="material-symbols-outlined">save</span> Guardar Evento
                    </button>
                </div>
            </form>
        </div>

        <!-- Lista de Eventos Existentes -->
        <div class="titulo-lista">
            <span class="material-symbols-outlined">event</span> Eventos Registrados
        </div>

        <div id="lista-eventos-admin" class="lista-eventos-admin">
            <div style="text-align:center; color:var(--accent); padding:20px;">Cargando eventos...</div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, set, remove, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { obtenerCanciones } from './js/api-cliente.js';

        const firebaseConfig = {
            apiKey: "AIzaSyA3g3DmWC_mYrA2RFj75sOoX9kolmzKINA",
            authDomain: "rondalla-f04a4.firebaseapp.com",
            databaseURL: "https://rondalla-f04a4-default-rtdb.firebaseio.com",
            projectId: "rondalla-f04a4",
            storageBucket: "rondalla-f04a4.firebasestorage.app",
            messagingSenderId: "835273996097",
            appId: "1:835273996097:web:f1258c2f461ef6613513c0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const formIdE = document.getElementById('form-id-e');
        const formTitulo = document.getElementById('form-titulo');
        const formFecha = document.getElementById('form-fecha');
        const formVestimenta = document.getElementById('form-vestimenta');
        const formHoraInicio = document.getElementById('form-hora-inicio');
        const formHoraFin = document.getElementById('form-hora-fin');
        const formLugar = document.getElementById('form-lugar');
        const formLinkLugar = document.getElementById('form-link-lugar');
        const formNotas = document.getElementById('form-notas');
        
        const contenedorCancionesSelector = document.getElementById('contenedor-canciones-selector');
        const btnGuardarEvento = document.getElementById('btn-guardar-evento');
        const btnCancelarForm = document.getElementById('btn-cancelar-form');
        const tituloForm = document.getElementById('titulo-form');
        const listaEventosAdmin = document.getElementById('lista-eventos-admin');

        let listaCancionesGlobal = [];
        let cancionesSeleccionadas = [];
        let eventosGlobalMap = {};

        function formatearHoraAMPM(horaStr) {
            if (!horaStr) return '';
            if (horaStr.toLowerCase().includes('a.m') || horaStr.toLowerCase().includes('p.m')) return horaStr;
            const partes = horaStr.split(':');
            if (partes.length < 2) return horaStr;
            let hrs = parseInt(partes[0], 10);
            const mins = partes[1].trim();
            if (isNaN(hrs)) return horaStr;
            const ampm = hrs >= 12 ? 'p.m.' : 'a.m.';
            hrs = hrs % 12;
            if (hrs === 0) hrs = 12;
            return `${hrs}:${mins}${ampm}`;
        }

        function formatearFechaHorario(stringFecha, horaInicio, horaFin) {
            const inicioFormatted = formatearHoraAMPM(horaInicio);
            const finFormatted = formatearHoraAMPM(horaFin);

            let rangoHoras = '';
            if (inicioFormatted && finFormatted) rangoHoras = `${inicioFormatted}-${finFormatted}`;
            else if (inicioFormatted) rangoHoras = inicioFormatted;

            if (!stringFecha) {
                return rangoHoras || '—';
            }

            const partes = stringFecha.split('-');
            let textoFecha = stringFecha;
            if (partes.length === 3) {
                const d = new Date(partes[0], partes[1] - 1, partes[2]);
                textoFecha = d.toLocaleDateString('es-MX', { weekday: 'short', day: 'numeric', month: 'short' });
                textoFecha = textoFecha.charAt(0).toUpperCase() + textoFecha.slice(1);
            }

            return rangoHoras ? `${textoFecha} · ${rangoHoras}` : textoFecha;
        }

        async function cargarCanciones() {
            try {
                const todasLasCanciones = await obtenerCanciones();
                listaCancionesGlobal = todasLasCanciones.filter(c => (c.categoria || 'rondalla') === 'rondalla');
                renderizarSelectorCanciones();
            } catch (err) {
                contenedorCancionesSelector.innerHTML = '<span style="color:var(--text-sec); font-size:12px;">Error al cargar canciones.</span>';
            }
        }

        function renderizarSelectorCanciones() {
            contenedorCancionesSelector.innerHTML = '';

            if (!listaCancionesGlobal || listaCancionesGlobal.length === 0) {
                contenedorCancionesSelector.innerHTML = '<span style="color:var(--text-sec); font-size:12px;">No hay canciones de Rondalla registradas.</span>';
                return;
            }

            const seleccionadas = [];
            cancionesSeleccionadas.forEach(id => {
                const enc = listaCancionesGlobal.find(c => String(c.idC) === String(id));
                if (enc) seleccionadas.push(enc);
            });

            const noSeleccionadas = listaCancionesGlobal.filter(c => 
                !cancionesSeleccionadas.some(id => String(id) === String(c.idC))
            );

            seleccionadas.forEach(cancion => {
                const tarjeta = document.createElement('div');
                tarjeta.className = 'tarjeta-cancion-selector seleccionada';
                tarjeta.innerHTML = `
                    <span>${cancion.nombreC}</span>
                    <span class="material-symbols-outlined icono-chk">check_circle</span>
                `;
                tarjeta.onclick = () => {
                    cancionesSeleccionadas = cancionesSeleccionadas.filter(id => String(id) !== String(cancion.idC));
                    renderizarSelectorCanciones();
                };
                contenedorCancionesSelector.appendChild(tarjeta);
            });

            noSeleccionadas.forEach(cancion => {
                const tarjeta = document.createElement('div');
                tarjeta.className = 'tarjeta-cancion-selector';
                tarjeta.innerHTML = `
                    <span>${cancion.nombreC}</span>
                    <span class="material-symbols-outlined icono-chk">check_circle</span>
                `;
                tarjeta.onclick = () => {
                    cancionesSeleccionadas.push(String(cancion.idC));
                    renderizarSelectorCanciones();
                };
                contenedorCancionesSelector.appendChild(tarjeta);
            });
        }

        function resetearFormulario() {
            formIdE.value = '';
            formTitulo.value = '';
            formFecha.value = '';
            formVestimenta.value = '';
            formHoraInicio.value = '';
            formHoraFin.value = '';
            formLugar.value = '';
            formLinkLugar.value = '';
            formNotas.value = '';

            cancionesSeleccionadas = [];
            renderizarSelectorCanciones();

            tituloForm.innerHTML = '<span class="material-symbols-outlined" id="icono-form">add_circle</span> Crear Nuevo Evento';
            btnCancelarForm.style.display = 'none';
        }

        function escucharEventosFirebase() {
            const eventosRef = ref(db, 'eventos');
            onValue(eventosRef, (snapshot) => {
                const datos = snapshot.val();
                eventosGlobalMap = datos || {};
                listaEventosAdmin.innerHTML = '';

                if (!datos) {
                    listaEventosAdmin.innerHTML = '<div style="text-align:center; color:var(--text-sec); font-size:13px; padding:20px;">No hay eventos guardados. ¡Crea el primero arriba!</div>';
                    return;
                }

                Object.keys(datos).forEach(idE => {
                    const evento = datos[idE];
                    const div = document.createElement('div');
                    div.className = 'tarjeta-evento-admin';

                    const numCanciones = Array.isArray(evento.canciones) ? evento.canciones.length : 0;

                    div.innerHTML = `
                        <div class="info-evento-admin">
                            <h3>${evento.titulo}</h3>
                            <div class="meta-evento-admin">
                                <span class="meta-item-admin">
                                    <span class="material-symbols-outlined" style="font-size:15px;">schedule</span> 
                                    ${formatearFechaHorario(evento.fecha, evento.horaInicio, evento.horaFin)}
                                </span>
                                <span class="meta-item-admin">
                                    <span class="material-symbols-outlined" style="font-size:15px;">location_on</span> 
                                    ${evento.lugar || '—'}
                                </span>
                                <span class="meta-item-admin">
                                    <span class="material-symbols-outlined" style="font-size:15px;">queue_music</span> 
                                    ${numCanciones} ${numCanciones === 1 ? 'canción' : 'canciones'}
                                </span>
                            </div>
                        </div>
                        <div class="botones-item-admin">
                            <button class="btn-mini btn-editar" data-id="${idE}">
                                <span class="material-symbols-outlined" style="font-size:15px;">edit</span> Editar
                            </button>
                            <button class="btn-mini btn-eliminar" data-id="${idE}">
                                <span class="material-symbols-outlined" style="font-size:15px;">delete</span> Borrar
                            </button>
                        </div>
                    `;
                    listaEventosAdmin.appendChild(div);
                });

                document.querySelectorAll('.btn-editar').forEach(btn => {
                    btn.onclick = () => editarEvento(btn.getAttribute('data-id'));
                });

                document.querySelectorAll('.btn-eliminar').forEach(btn => {
                    btn.onclick = () => borrarEvento(btn.getAttribute('data-id'));
                });
            });
        }

        function editarEvento(idE) {
            const evento = eventosGlobalMap[idE];
            if (!evento) return;

            formIdE.value = idE;
            formTitulo.value = evento.titulo || '';
            formFecha.value = evento.fecha || '';
            formVestimenta.value = evento.vestimenta || '';
            formHoraInicio.value = evento.horaInicio || '';
            formHoraFin.value = evento.horaFin || '';
            formLugar.value = evento.lugar || '';
            formLinkLugar.value = evento.linkLugar || '';
            formNotas.value = evento.notas || evento.nota || '';

            cancionesSeleccionadas = Array.isArray(evento.canciones) ? evento.canciones.map(String) : [];
            renderizarSelectorCanciones();

            tituloForm.innerHTML = '<span class="material-symbols-outlined" id="icono-form">edit_note</span> Editar Evento';
            btnCancelarForm.style.display = 'inline-flex';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function borrarEvento(idE) {
            const evento = eventosGlobalMap[idE];
            const titulo = evento ? evento.titulo : 'este evento';

            if (!confirm(`¿Estás seguro de eliminar "${titulo}"?\n\nEsta acción también eliminará permanentemente la base de datos de asistencias de este evento.`)) {
                return;
            }

            try {
                await remove(ref(db, `eventos/${idE}`));
                await remove(ref(db, `asistencias/${idE}`));
                if (formIdE.value === idE) resetearFormulario();
            } catch (err) {
                console.error(err);
                alert('Ocurrió un error al intentar eliminar el evento.');
            }
        }

        btnGuardarEvento.onclick = async () => {
            if (!formTitulo.value.trim()) {
                alert('Por favor completa el campo obligatorio: Título del Evento.');
                return;
            }

            let idE = formIdE.value;

            if (!idE) {
                const nuevoRef = push(ref(db, 'eventos'));
                idE = `evt_${nuevoRef.key}`;
            }

            const objetoEvento = {
                idE: idE,
                titulo: formTitulo.value.trim(),
                fecha: formFecha.value,
                vestimenta: formVestimenta.value.trim(),
                horaInicio: formHoraInicio.value,
                horaFin: formHoraFin.value,
                lugar: formLugar.value.trim(),
                linkLugar: formLinkLugar.value.trim(),
                notas: formNotas.value.trim(),
                canciones: cancionesSeleccionadas
            };

            try {
                await set(ref(db, `eventos/${idE}`), objetoEvento);
                resetearFormulario();
            } catch (err) {
                console.error(err);
                alert('No se pudieron guardar los cambios en Firebase.');
            }
        };

        btnCancelarForm.onclick = resetearFormulario;

        async function init() {
            await cargarCanciones();
            escucharEventosFirebase();
        }

        init();
    </script>
</body>
</html>
