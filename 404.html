<!DOCTYPE html>
<html lang="es-mx">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta name="color-scheme" content="dark">

    <link rel="icon" type="image/x-icon" href="img/icono.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sono:MONO@0..1&display=swap" rel="stylesheet">

    <link href="style.css" rel="stylesheet">
    <title>404 - Página no encontrada</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        /*
         * La página no debe desplazarse nunca: así, ni el rebote de iOS ni un body con
         * altura/padding heredado de style.css pueden mover el contenido en la PWA.
         */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
        }

        /* Color de respaldo por si style.css no carga */
        html {
            background-color: var(--bg-color, #0d0d0d);
        }

        /*
         * Contenedor fijo que cubre toda la pantalla. Como no depende del <body>
         * (su ancho máximo, márgenes, padding o display definidos en style.css),
         * el centrado funciona igual en cualquier navegador y tamaño de pantalla.
         */
        .pagina-404 {
            --acento: var(--accent, #bc9731);
            --tarjeta: var(--card-bg, #1c1c21);
            --texto: var(--text-main, #f2f2f2);

            position: fixed;
            inset: 0;
            z-index: 1;
            isolation: isolate;
            display: flex;
            overflow: auto;
            overscroll-behavior: none;
            /* Padding simétrico: las áreas seguras (notch / barra inferior) son distintas arriba y abajo y descentraban la tarjeta en la PWA */
            padding: 16px;
            font-family: 'Sono', monospace;
        }

        /* Marca de agua centrada (70% del área visible) */
        .pagina-404::before {
            content: "";
            position: fixed;
            inset: 15%;
            background-image: url('img/fondo.png');
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            opacity: 0.18;
            pointer-events: none;
            z-index: -1;
        }

        /* margin: auto centra en ambos ejes y, si la tarjeta no cabe, permite hacer scroll sin recortarla */
        .tarjeta-404 {
            position: relative;
            margin: auto;
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            padding: 40px 30px;
            background-color: var(--tarjeta);
            border: 2px solid var(--acento);
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            text-align: center;
            animation: aparecer404 0.25s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }

        @keyframes aparecer404 {
            0%   { opacity: 0; transform: scale(0.85); }
            70%  { opacity: 1; transform: scale(1.03); }
            100% { opacity: 1; transform: scale(1); }
        }

        .codigo-404 {
            width: 100%;
            margin: 0;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--acento);
            color: var(--acento);
            font-family: 'Sono', monospace;
            font-size: clamp(56px, 18vw, 72px);
            font-weight: 700;
            line-height: 1;
        }

        .mensaje-404 {
            margin: 0;
            color: var(--texto);
            font-family: 'Sono', monospace;
            font-size: 15px;
            line-height: 1.5;
            text-wrap: balance;
        }

        .btn-inicio {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
            padding: 10px 22px;
            background-color: var(--tarjeta);
            color: var(--texto);
            border: 2px solid var(--acento);
            border-radius: 12px;
            font-family: 'Sono', monospace;
            font-size: 14px;
            text-decoration: none;
            cursor: pointer;
            outline: none;
            transition: box-shadow 0.2s, border-color 0.2s, transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
            -webkit-tap-highlight-color: transparent;
        }

        .btn-inicio:focus-visible {
            outline: 2px solid var(--acento);
            outline-offset: 3px;
        }

        @media (hover: hover) {
            .btn-inicio:hover {
                transform: translateY(-2px) scale(1.03);
                box-shadow: 0 0 10px rgba(188, 151, 49, 0.4);
            }
        }

        .btn-inicio:active {
            transform: translateY(1px) scale(0.98);
        }

        @media (prefers-reduced-motion: reduce) {
            .tarjeta-404 { animation: none; }
            .btn-inicio { transition: none; }
        }
    </style>
</head>
<body>
    <main class="pagina-404">
        <article class="tarjeta-404">
            <h1 class="codigo-404">404</h1>
            <p class="mensaje-404">La página que buscas no existe</p>
            <a href="./" class="btn-inicio">← Volver al cancionero</a>
        </article>
    </main>
</body>
</html>
