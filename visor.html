<!DOCTYPE html>
<html lang="es-mx">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/x-icon" href="img/icono.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sono:MONO@0..1&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0&display=swap" />

    <link href="style.css" rel="stylesheet">
    <title>Visor de Letra y Acordes</title>
    <style>
        /* Configuración Global y Reset Base */
        *, *::before, *::after {
            box-sizing: border-box;
        }
        
        body { 
            padding-bottom: 120px; 
        }
        
        .container { 
            max-width: 90%;
            margin: 0 auto;
        }

        /* Animación Fade In para la imagen de fondo de la letra */
        @keyframes fadeInImagen {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 0.18;
            }
        }

        /* Animación 1: Extensión vertical suave con rebote elástico refinado */
        @keyframes extenderContenedor {
            0% {
                opacity: 0;
                transform: scaleY(0.7);
                transform-origin: top;
            }
            70% {
                opacity: 1;
                transform: scaleY(1.025);
                transform-origin: top;
            }
            100% {
                opacity: 1;
                transform: scaleY(1);
                transform-origin: top;
            }
        }

        /* Animación suave de entrada para el texto de la letra */
        @keyframes fadeInTexto {
            0% {
                opacity: 0;
                transform: translateY(12px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Animación 3: Despliegue elástico de cortina para el fondo del reproductor */
        @keyframes desplegarCortina {
            0% {
                opacity: 0;
                max-height: 0;
                margin-bottom: 0;
                padding-top: 0;
                padding-bottom: 0;
                transform: scaleY(0);
                transform-origin: top;
            }
            70% {
                opacity: 1;
                max-height: 100px;
                margin-bottom: 10px;
                padding-top: 12px;
                padding-bottom: 12px;
                transform: scaleY(1.05);
                transform-origin: top;
            }
            100% {
                opacity: 1;
                max-height: 100px;
                margin-bottom: 10px;
                padding-top: 12px;
                padding-bottom: 12px;
                transform: scaleY(1);
                transform-origin: top;
            }
        }

        /* Pop para botones e indicadores de tiempo */
        @keyframes popControlAudio {
            0% {
                opacity: 0;
                transform: scale(0.4);
            }
            75% {
                opacity: 1;
                transform: scale(1.15);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Revelado continuo de izquierda a derecha para el slider de audio */
        @keyframes expandirSliderAncho {
            0% {
                opacity: 0;
                clip-path: inset(0 100% 0 0);
            }
            100% {
                opacity: 1;
                clip-path: inset(0 0 0 0);
            }
        }

        /* Animación 4: Entradas elásticas para el Título, Artista y Capo */
        @keyframes deslizarTexto {
            0% {
                opacity: 0;
                transform: translateY(-10px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes popBadgeCapo {
            0% {
                opacity: 0;
                transform: scale(0.5);
            }
            70% {
                opacity: 1;
                transform: scale(1.12);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Animación 5A: Entrada elástica para la caja de diagrama de acordes */
        @keyframes popModalEntrada {
            0% {
                opacity: 0;
                transform: scale(0.6) translateY(12px);
            }
            70% {
                opacity: 1;
                transform: scale(1.06) translateY(-2px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* Animación 5B: Salida suave al cerrar el diagrama de acordes */
        @keyframes popModalSalida {
            0% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
            100% {
                opacity: 0;
                transform: scale(0.7) translateY(8px);
            }
        }

        /* Animación 6A: Entrada deslizable tipo barra desde abajo con rebote elástico */
        @keyframes deslizarPanelTransponer {
            0% {
                opacity: 0;
                transform: translateY(45px);
            }
            70% {
                opacity: 1;
                transform: translateY(-4px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Animación 6B: Salida directa hacia abajo */
        @keyframes deslizarPanelTransponerSalida {
            0% {
                opacity: 1;
                transform: translateY(0);
            }
            100% {
                opacity: 0;
                transform: translateY(45px);
            }
        }

        @keyframes popBotonTransponer {
            0% {
                opacity: 0;
                transform: scale(0.3);
            }
            70% {
                opacity: 1;
                transform: scale(1.15);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Animación 7: Entrada deslizable desde abajo para la barra de autoscroll y botón de transposición */
        @keyframes deslizarElementoInferior {
            0% {
                opacity: 0;
                transform: translateY(45px);
            }
            70% {
                opacity: 1;
                transform: translateY(-4px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Encabezados y Botón Volver */
        .btn-volver { 
            display: inline-block;
            color: var(--text-sec);
            text-decoration: none;
            font-size: 13px;
            margin-bottom: 15px;
        }
        
        /* Reproductor con efecto cortina y transición suave de altura */
        .contenedor-audio {
            background: var(--card-bg);
            padding: 12px 25px;
            border-radius: 50px;
            margin-bottom: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            overflow: hidden;

            will-change: transform, opacity, max-height, margin-bottom, padding;
            animation: desplegarCortina 0.38s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        /* Envoltorio para revelado de izquierda a derecha sin recortes en el thumb */
        .audio-slider-wrapper {
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: center;
            opacity: 0;
            will-change: clip-path, opacity;
            animation: expandirSliderAncho 0.32s cubic-bezier(0.25, 1, 0.5, 1) 0.18s forwards;
        }

        /* Aplicación del stagger a los elementos del reproductor */
        .contenedor-audio #btn-audio-play,
        .contenedor-audio #audio-tiempo-actual,
        .contenedor-audio #audio-tiempo-total,
        .contenedor-audio #btn-audio-mute {
            opacity: 0;
            will-change: transform, opacity;
            animation: popControlAudio 0.22s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .contenedor-audio #btn-audio-play { animation-delay: 0.12s; }
        .contenedor-audio #audio-tiempo-actual { animation-delay: 0.15s; }
        .contenedor-audio #audio-tiempo-total { animation-delay: 0.22s; }
        .contenedor-audio #btn-audio-mute { animation-delay: 0.25s; }
        
        .btn-audio-ctrl {
            background: var(--accent);
            color: var(--bg-color);
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            user-select: none;
            font-family: 'Material Symbols Outlined' !important;
            font-weight: normal !important;
            font-style: normal !important;
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24 !important;
            -webkit-font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24 !important;
        }

        .audio-slider {
            width: 100%;
            accent-color: var(--accent);
            cursor: pointer;
            border-radius: 3px;
        }

        .audio-time {
            font-family: 'Sono', monospace;
            font-size: 12px;
            color: var(--text-sec);
            white-space: nowrap;
            user-select: none;
        }

        .info-cabecera {
            grid-column: 1 / 3;
            margin-bottom: 10px;
        }

        .titulo-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }
        
        .info-cabecera h1 {
            margin: 0;
            font-size: 24px;
            opacity: 0;
            will-change: transform, opacity;
            animation: deslizarTexto 0.25s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        /* Badge de Capotrasto animado */
        .badge-capo {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: var(--card-bg);
            border: 2px solid var(--accent);
            color: var(--accent);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            opacity: 0;
            will-change: transform, opacity;
            animation: popBadgeCapo 0.25s cubic-bezier(0.34, 1.56, 0.64, 1) 0.12s forwards;
        }
        
        .info-cabecera h2 {
            margin: 5px 0 10px 0;
            padding-bottom: 10px;
            font-size: 18px;
            font-weight: 400;
            border-bottom: 2px solid var(--accent);
            opacity: 0;
            will-change: transform, opacity;
            animation: deslizarTexto 0.25s cubic-bezier(0.34, 1.56, 0.64, 1) 0.08s forwards;
        }
        
        /* Área Principal (Workspace) */
        .workspace { 
            display: grid;
            gap: 30px;
            margin: 0 auto;
            align-items: start;
        }
        
        /* Contenedor de la Letra animado con curva elástica suave */
        .letra-contenedor {
            position: relative;
            background: var(--text-main);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            width: 100%;
            overflow: hidden;
            z-index: 1;

            opacity: 0;
            will-change: transform, opacity;
            animation: extenderContenedor 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.15) forwards;
        }

        .letra-contenedor::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85%;
            height: 85%;
            background-image: url('img/fondo.png');
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            opacity: 0;
            pointer-events: none;
            z-index: 0;

            will-change: opacity;
            animation: fadeInImagen 0.6s ease-out forwards;
        }
        
        .letra-texto { 
            position: relative;
            z-index: 1;
            display: block;
            font-family: 'Sono', monospace;
            font-variation-settings: 'MONO' 1;
            font-size: clamp(10px, 1.3vw, 16px);
            color: var(--bg-color);
            margin: 0;
            white-space: pre;
            overflow-x: auto;
            width: 100%;
            opacity: 1;
            will-change: transform, opacity;
        }

        .letra-texto.animar-entrada-texto {
            animation: fadeInTexto 0.32s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        
        .acorde-link { 
            color: #0066cc;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
            border-radius: 3px;
            -webkit-tap-highlight-color: transparent;
        }
                
        .barra-compas { 
            color: var(--bg-color);
            font-weight: bold; 
        }
        
        /* Modales y Cajas Emergentes */
        .caja-acorde-emergente { 
            position: fixed; 
            display: none; 
            background: var(--card-bg);
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); 
            padding: 12px; 
            z-index: 1000; 
            width: fit-content;
            max-width: 90vw;
            text-align: center;
            will-change: transform, opacity;
        }

        .caja-acorde-emergente.animar-entrada {
            animation: popModalEntrada 0.22s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .caja-acorde-emergente.animar-salida {
            animation: popModalSalida 0.18s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        
        .caja-acorde-emergente h4 { 
            margin: 0 0 6px 0; 
            font-size: 16px; 
            font-family: 'Sono', sans-serif;
            font-variation-settings: 'MONO' 0;
        }
        
        #wrapper-render {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            margin: 5px 0 0 0;
        }
        
        #panel-flotante-wrapper {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            z-index: 999;
        }
        
        .fila-inferior {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 290px;
            max-width: 90vw;
        }

        #panel-scroll {
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 20px;
            opacity: 0;
            will-change: transform, opacity;
            animation: deslizarElementoInferior 0.28s cubic-bezier(0.34, 1.56, 0.64, 1) 0.22s forwards;
        }
        
        .panel-scroll-flotante {
            background: var(--card-bg);
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
        }

        /* Animación para la barra de transponer y sus botones */
        #panel-transponer {
            width: 290px;
            max-width: 90vw;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
        }

        #panel-transponer.panel-transponer-entrada {
            will-change: transform, opacity;
            animation: deslizarPanelTransponer 0.28s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        #panel-transponer.panel-transponer-salida {
            will-change: transform, opacity;
            animation: deslizarPanelTransponerSalida 0.2s cubic-bezier(0.4, 0, 0.2, 1) forwards !important;
        }

        #panel-transponer.panel-transponer-entrada .btn-transponer,
        #panel-transponer.panel-transponer-entrada #btn-reset-tono {
            opacity: 0;
            will-change: transform, opacity;
            animation: popBotonTransponer 0.22s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        #panel-transponer #btn-bajar-tono   { animation-delay: 0.05s; }
        #panel-transponer #btn-bajar-medio  { animation-delay: 0.09s; }
        #panel-transponer #btn-subir-medio  { animation-delay: 0.13s; }
        #panel-transponer #btn-subir-tono   { animation-delay: 0.17s; }
        #panel-transponer #btn-reset-tono   { animation-delay: 0.21s; }
        
        .btn-scroll,
        .btn-transponer,
        .btn-toggle-transponer {
            font-family: 'Sono', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
            flex-shrink: 0;
        }
        
        .btn-scroll { 
            background: var(--accent);
            border: none;
            color: var(--bg-color);
            width: 36px;
            height: 36px;
            user-select: none;
            font-family: 'Material Symbols Outlined' !important;
            font-weight: normal !important;
            font-style: normal !important;
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24 !important;
            -webkit-font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24 !important;
        }

        .btn-transponer {
            background: var(--text-main);
            color: var(--bg-color);
            border: none;
            width: 36px; 
            height: 36px; 
            font-size: 14px; 
        }

        #btn-reset-tono {
            background: var(--accent);
        }
        
        .btn-toggle-transponer {
            background: var(--card-bg);
            border: 2px solid var(--card-bg);
            color: var(--text-main);
            height: 62px;
            width: 62px;
            padding: 0;
            border-radius: 50px;
            font-size: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            opacity: 0;
            will-change: transform, opacity;
            animation: deslizarElementoInferior 0.28s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s forwards;
        }

        .btn-toggle-transponer.abierto {
            color: var(--accent);
            border-color: var(--accent);
        }
        
        .slider-scroll { 
            flex: 1;
            min-width: 0;
            width: 100%;
            accent-color: var(--accent); 
        }

        .btn-audio-ctrl,        
        .btn-scroll,
        .btn-transponer,
        .btn-toggle-transponer {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            transition: transform 0.05s;
        }
        
        .btn-audio-ctrl:active,
        .btn-scroll:active,
        .btn-transponer:active,
        .btn-toggle-transponer:active {
            transform: scale(1.1) !important;
        }

        @media (hover: hover) {
            .btn-audio-ctrl:hover,
            .btn-scroll:hover,
            .btn-transponer:hover,
            .btn-toggle-transponer:hover {
                transform: scale(1.1) !important;
            }
        }

        @media (max-width: 600px) {
            .caja-acorde-emergente {
                padding: 8px 12px;
                border-radius: 20px;
            }

            .caja-acorde-emergente h4 {
                font-size: 14px;
                margin-bottom: 2px;
            }

            .titulo-row {
                flex-wrap: wrap;
                gap: 8px;
            }

            .badge-capo {
                font-size: 12px;
                padding: 4px 10px;
            }

            .contenedor-audio {
                gap: 12px;
            }

            .btn-audio-ctrl {
                width: 30px;
                height: 30px;
                font-size: 18px;
            }

            .audio-time {
                font-size: 10px;
            }
        }
        
        @media (max-width: 1300px) {
            body { 
                padding: 40px 5px 100px 5px;
            }
        
            .workspace { 
                display: flex;
                flex-direction: column-reverse; 
                gap: 20px;
            }
        
            .letra-contenedor {
                padding: 30px;
            }
        
            .letra-texto {
                line-height: 1.5;
                letter-spacing: -0.3px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a id="link-regreso" href="." class="btn-volver">← Volver al cancionero</a>

        <div class="info-cabecera">
            <div class="titulo-row">
                <h1 id="titulo-cancion">Cargando...</h1>
                <div id="badge-capo" class="badge-capo" style="display: none;">
                    <span id="texto-capo"></span>
                </div>
            </div>
            <h2 id="nombre-artista"></h2>
        </div>

        <!-- Reproductor de Audio con Controles e Iconos Rellenos de Google -->
        <div id="contenedor-audio" class="contenedor-audio" style="display: none;">
            <audio id="reproductor-audio" preload="metadata"></audio>
            <button id="btn-audio-play" class="btn-audio-ctrl material-symbols-outlined" title="Reproducir/Pausar">play_arrow</button>
            <span id="audio-tiempo-actual" class="audio-time">0:00</span>
            <div class="audio-slider-wrapper">
                <input type="range" id="audio-progress" class="audio-slider" min="0" max="100" value="0">
            </div>
            <span id="audio-tiempo-total" class="audio-time">0:00</span>
            <button id="btn-audio-mute" class="btn-audio-ctrl material-symbols-outlined" title="Silenciar">volume_up</button>
        </div>

        <div class="workspace">
            <article class="letra-contenedor">
                <pre id="letra-cancion" class="letra-texto">Abriendo canción...</pre>
            </article>
        </div>
    </div>

    <div id="caja-acorde" class="caja-acorde-emergente">
       <h4 id="acorde-titulo"></h4>
       <span id="origen-acorde-modal" style="font-size:10px; opacity:0.6; display:block; margin-bottom:4px;"></span>
       <div id="wrapper-render"></div> 
    </div>
    
    <div id="panel-flotante-wrapper">
        <div id="panel-transponer" class="panel-scroll-flotante" style="display:none;">
            <button id="btn-bajar-tono" class="btn-transponer" title="Bajar 1 tono">−1</button>
            <button id="btn-bajar-medio" class="btn-transponer" title="Bajar medio tono">−½</button>
            <button id="btn-subir-medio" class="btn-transponer" title="Subir medio tono">+½</button>
            <button id="btn-subir-tono" class="btn-transponer" title="Subir 1 tono">+1</button>
            <button id="btn-reset-tono" class="btn-scroll material-symbols-outlined" title="Volver a la tonalidad original">refresh</button>
        </div>

        <div class="fila-inferior">
            <div id="panel-scroll" class="panel-scroll-flotante">
                <button id="btn-play-scroll" class="btn-scroll material-symbols-outlined">play_arrow</button>
                <input type="range" id="slider-velocidad" class="slider-scroll" min="1" max="10" value="5">
            </div>
            <button id="btn-toggle-transponer" class="btn-toggle-transponer" title="Transponer">—</button>
        </div>
    </div>

    <script src="js/acordes.js"></script>

    <script type="module">
        import { obtenerContenidoCancion } from './js/api-cliente.js';
        import { procesarLetraYAcordes, inicializarModalAcordes } from './js/modulo-acordes.js';
        import { inicializarAutoscroll } from './js/modulo-autoscroll.js';
        import { inicializarTransponer } from './js/modulo-transponer.js';

        const params = new URLSearchParams(window.location.search);
        const idC = params.get('idC');

        const letraCancionDiv = document.getElementById('letra-cancion');

        const FORMATOS_AUDIO = [
            { ext: 'mp3', mime: 'audio/mpeg' },
            { ext: 'm4a', mime: 'audio/mp4' },
            { ext: 'wav', mime: 'audio/wav' },
            { ext: 'ogg', mime: 'audio/ogg' },
            { ext: 'aac', mime: 'audio/aac' },
            { ext: 'flac', mime: 'audio/flac' },
            { ext: 'opus', mime: 'audio/opus' },
            { ext: 'webm', mime: 'audio/webm' }
        ];

        function formatearTiempo(segundos) {
            if (isNaN(segundos) || segundos < 0) return "0:00";
            const mins = Math.floor(segundos / 60);
            const segs = Math.floor(segundos % 60);
            return `${mins}:${segs < 10 ? '0' : ''}${segs}`;
        }

        function inicializarControladorAudio() {
            const reproductorAudio = document.getElementById('reproductor-audio');
            const btnPlay = document.getElementById('btn-audio-play');
            const btnMute = document.getElementById('btn-audio-mute');
            const sliderProgress = document.getElementById('audio-progress');
            const txtActual = document.getElementById('audio-tiempo-actual');
            const txtTotal = document.getElementById('audio-tiempo-total');

            if (!reproductorAudio || !btnPlay) return;

            btnPlay.addEventListener('click', () => {
                if (reproductorAudio.paused) {
                    reproductorAudio.play().then(() => {
                        btnPlay.textContent = 'pause';
                    }).catch(e => console.log('Error de reproducción:', e));
                } else {
                    reproductorAudio.pause();
                    btnPlay.textContent = 'play_arrow';
                }
            });

            btnMute.addEventListener('click', () => {
                reproductorAudio.muted = !reproductorAudio.muted;
                btnMute.textContent = reproductorAudio.muted ? 'no_sound' : 'volume_up';
            });

            reproductorAudio.addEventListener('loadedmetadata', () => {
                txtTotal.textContent = formatearTiempo(reproductorAudio.duration);
            });

            reproductorAudio.addEventListener('timeupdate', () => {
                if (reproductorAudio.duration) {
                    const porcentaje = (reproductorAudio.currentTime / reproductorAudio.duration) * 100;
                    sliderProgress.value = porcentaje;
                    txtActual.textContent = formatearTiempo(reproductorAudio.currentTime);
                }
            });

            reproductorAudio.addEventListener('ended', () => {
                btnPlay.textContent = 'play_arrow';
                sliderProgress.value = 0;
                txtActual.textContent = "0:00";
            });

            sliderProgress.addEventListener('input', () => {
                if (reproductorAudio.duration) {
                    const tiempoIr = (sliderProgress.value / 100) * reproductorAudio.duration;
                    reproductorAudio.currentTime = tiempoIr;
                    txtActual.textContent = formatearTiempo(tiempoIr);
                }
            });
        }

        async function buscarYCarGarGrabacion(nombreCancion) {
            const contenedorAudio = document.getElementById('contenedor-audio');
            const reproductorAudio = document.getElementById('reproductor-audio');
            
            const nombreLimpio = nombreCancion
                .replace(/\(.*?\)/g, '')
                .replace(/-/g, '')
                .replace(/\s+/g, ' ')
                .trim();

            const nombreEncoded = encodeURIComponent(nombreLimpio);

            for (const formato of FORMATOS_AUDIO) {
                const rutaArchivo = `Grabaciones/${nombreEncoded}.${formato.ext}`;
                try {
                    const respuesta = await fetch(rutaArchivo, { method: 'HEAD' });
                    if (respuesta.ok) {
                        reproductorAudio.src = rutaArchivo;
                        reproductorAudio.load();
                        contenedorAudio.style.display = 'flex';
                        inicializarControladorAudio();
                        return;
                    }
                } catch (e) {
                    // Continuar con el siguiente formato
                }
            }

            contenedorAudio.style.display = 'none';
        }

        async function cargarPlantilla() {
            if(!idC) {
                letraCancionDiv.textContent = "Error: No se definió el identificador de la canción.";
                return;
            }

            try {
                const data = await obtenerContenidoCancion(idC);
                if (data.error) { letraCancionDiv.textContent = "Error: " + data.error; return; }

                const etiquetaMeta = (data.categoria === 'general') ? 'Artista' : 'Arreglos';

                document.getElementById('titulo-cancion').textContent = data.nombreC;
                document.getElementById('nombre-artista').textContent = data.arreglos ? `${etiquetaMeta}: ${data.arreglos}` : '';

                if (data.nombreC) {
                    buscarYCarGarGrabacion(data.nombreC);
                }

                let contenidoProcesar = data.contenido || "";
                const matchCapo = contenidoProcesar.match(/Capo:\s*#?\s*(\d+)/i);
                const badgeCapo = document.getElementById('badge-capo');
                const textoCapo = document.getElementById('texto-capo');

                if (matchCapo) {
                    const numeroCapo = matchCapo[1];
                    if (badgeCapo && textoCapo) {
                        textoCapo.textContent = `Capo: ${numeroCapo}º traste`;
                        badgeCapo.style.display = 'inline-flex';
                    }

                    const lineas = contenidoProcesar.split(/\r?\n/);
                    if (lineas.length > 0 && /Capo:/i.test(lineas[0])) {
                        lineas.splice(0, Math.min(2, lineas.length));
                        contenidoProcesar = lineas.join('\n');
                    } else {
                        contenidoProcesar = contenidoProcesar.replace(/^.*Capo:\s*#?\s*\d+.*(?:\r?\n)?/im, '');
                    }
                } else {
                    if (badgeCapo) badgeCapo.style.display = 'none';
                }

                letraCancionDiv.innerHTML = procesarLetraYAcordes(contenidoProcesar);
                
                // Disparar la animación de la letra justo al insertar el contenido real
                letraCancionDiv.classList.remove('animar-entrada-texto');
                void letraCancionDiv.offsetWidth;
                letraCancionDiv.classList.add('animar-entrada-texto');

                inicializarModalAcordes('caja-acorde');

                // Controlador de animaciones dinámicas de entrada, cambio de acorde y salida
                const cajaAcordeEl = document.getElementById('caja-acorde');
                if (cajaAcordeEl) {
                    let enProcesoDeCierre = false;
                    let ultimoDisplayVal = 'none';

                    document.addEventListener('click', (e) => {
                        const linkAcorde = e.target.closest('.acorde-link');
                        if (linkAcorde) {
                            enProcesoDeCierre = false;
                            cajaAcordeEl.classList.remove('animar-salida');

                            cajaAcordeEl.classList.remove('animar-entrada');
                            void cajaAcordeEl.offsetWidth;
                            cajaAcordeEl.classList.add('animar-entrada');
                        }
                    }, true);

                    const observadorCaja = new MutationObserver(() => {
                        const displayActual = cajaAcordeEl.style.display;

                        if (displayActual === 'none' && !enProcesoDeCierre && ultimoDisplayVal !== 'none') {
                            enProcesoDeCierre = true;
                            cajaAcordeEl.style.display = ultimoDisplayVal;
                            cajaAcordeEl.classList.remove('animar-entrada');
                            cajaAcordeEl.classList.add('animar-salida');

                            setTimeout(() => {
                                cajaAcordeEl.classList.remove('animar-salida');
                                cajaAcordeEl.style.display = 'none';
                                ultimoDisplayVal = 'none';
                                enProcesoDeCierre = false;
                            }, 180);
                        } else if (displayActual !== 'none' && !enProcesoDeCierre) {
                            ultimoDisplayVal = displayActual;
                        }
                    });

                    observadorCaja.observe(cajaAcordeEl, { attributes: true, attributeFilter: ['style'] });
                }

                // Controlador de animación de deslizamiento vertical al ocultar
                const panelTranspon = document.getElementById('panel-transponer');
                if (panelTranspon) {
                    let enProcesoCierrePanel = false;
                    let ultimoDisplayPanel = 'none';

                    const observadorPanel = new MutationObserver(() => {
                        const displayActual = panelTranspon.style.display;

                        if (displayActual === 'none' && !enProcesoCierrePanel && ultimoDisplayPanel !== 'none') {
                            enProcesoCierrePanel = true;
                            panelTranspon.style.display = ultimoDisplayPanel;
                            panelTranspon.classList.remove('panel-transponer-entrada');
                            panelTranspon.classList.add('panel-transponer-salida');

                            setTimeout(() => {
                                panelTranspon.classList.remove('panel-transponer-salida');
                                panelTranspon.style.display = 'none';
                                ultimoDisplayPanel = 'none';
                                enProcesoCierrePanel = false;
                            }, 200);
                        } else if (displayActual !== 'none' && !enProcesoCierrePanel) {
                            ultimoDisplayPanel = displayActual;
                            panelTranspon.classList.remove('panel-transponer-salida');
                            panelTranspon.classList.add('panel-transponer-entrada');
                        }
                    });

                    observadorPanel.observe(panelTranspon, { attributes: true, attributeFilter: ['style'] });
                }

                inicializarAutoscroll('btn-play-scroll', 'slider-velocidad');
                
                const btnScrollEl = document.getElementById('btn-play-scroll');
                if (btnScrollEl) {
                    const sincronizarIconoScroll = () => {
                        const txt = btnScrollEl.textContent.trim();
                        if (txt === '▶' || txt === 'play' || txt === 'PLAY') {
                            if (btnScrollEl.textContent !== 'play_arrow') btnScrollEl.textContent = 'play_arrow';
                        } else if (txt === '⏸' || txt === 'pause' || txt === 'PAUSE' || txt === 'PAUSA') {
                            if (btnScrollEl.textContent !== 'pause') btnScrollEl.textContent = 'pause';
                        }
                    };
                    sincronizarIconoScroll();
                    const observerScroll = new MutationObserver(sincronizarIconoScroll);
                    observerScroll.observe(btnScrollEl, { childList: true, characterData: true, subtree: true });
                }

                inicializarTransponer({
                    contenidoOriginal: contenidoProcesar,
                    onRetransponer: (texto) => {
                        letraCancionDiv.innerHTML = procesarLetraYAcordes(texto);
                    },
                    tonalidadLabelId: 'btn-toggle-transponer',
                    btnSubirTonoId: 'btn-subir-tono',
                    btnSubirMedioId: 'btn-subir-medio',
                    btnBajarMedioId: 'btn-bajar-medio',
                    btnBajarTonoId: 'btn-bajar-tono',
                    btnResetId: 'btn-reset-tono',
                    btnToggleId: 'btn-toggle-transponer',
                    panelId: 'panel-transponer'
                });

            } catch (err) {
                console.error(err);
                letraCancionDiv.textContent = "Error crítico al descargar el contenido de la canción.";
            }
        }

        cargarPlantilla();
    </script>
