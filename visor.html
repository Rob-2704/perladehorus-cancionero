<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="img/icono.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sono:MONO@0..1&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    <title>Visor de Letra y Acordes</title>
    <style>
        /* Configuración Global y Reset Base */
        *, *::before, *::after {
            box-sizing: border-box;
        }
        
        body { 
            padding-bottom: 120px; 
        }
        
        .container { 
            max-width: 90%;
            margin: 0 auto;
        }
        
        /* Encabezados y Botón Volver */
        .btn-volver { 
            display: inline-block; 
            color: #888; 
            text-decoration: none; 
            font-size: 13px;
            margin-bottom: 15px; 
            transition: color 0.2s;
        }
        
        .btn-volver:hover { 
            color: var(--accent); 
        }
        
        /* Contenedor del Reproductor de Audio Superior */
        .contenedor-audio {
            background: #1e1e24;
            border: 1px solid #333;
            border-radius: 30px;
            padding: 12px 18px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .audio-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .contenedor-audio audio {
            width: 100%;
            height: 40px;
            border-radius: 6px;
            outline: none;
        }

        .info-cabecera {
            grid-column: 1 / 3;
            margin-bottom: 10px;
        }

        .titulo-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }
        
        .info-cabecera h1 {
            margin: 0;
            font-size: 24px;
            color: #fff;
        }

        /* Badge de Capotrasto */
        .badge-capo {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: #1e1e24;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .badge-capo svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }
        
        .info-cabecera h2 {
            margin: 5px 0 10px 0;
            padding-bottom: 10px;
            font-size: 18px;
            color: #fff;
            font-weight: 400;
            border-bottom: 2px solid var(--accent);
        }
        
        /* Área Principal (Workspace) */
        .workspace { 
            display: grid;
            gap: 30px;
            margin: 0 auto;
            align-items: start;
        }
        
        /* Contenedor de la Letra */
        .letra-contenedor {
            position: relative;
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            width: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .letra-contenedor::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85%;
            height: 85%;
            background-image: url('img/fondo.png');
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            opacity: 0.18;
            pointer-events: none;
            z-index: 0;
        }
        
        .letra-texto { 
            position: relative;
            z-index: 1;
            display: block;
            font-family: 'Sono', monospace;
            font-variation-settings: 'MONO' 1;
            font-size: clamp(10px, 1.3vw, 16px);
            color: #3a3a3a;
            margin: 0;
            white-space: pre;
            overflow-x: auto;
            width: 100%;
        }
        
        .acorde-link { 
            color: #0066cc;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
            border-radius: 3px;
            transition: background 0.1s;
        }
        
        .acorde-link:hover { 
            background-color: #e1e4e8; 
            color: #004499; 
        }
        
        .barra-compas { 
            color: #3a3a3a; 
            font-weight: bold; 
        }
        
        /* Modales y Cajas Emergentes */
        .caja-acorde-emergente { 
            position: fixed; 
            display: none; 
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); 
            padding: 12px; 
            z-index: 1000; 
            width: fit-content;
            max-width: 90vw;
            text-align: center;
            color: #e0e0e0;
        }
        
        .caja-acorde-emergente h4 { 
            margin: 0 0 6px 0; 
            font-size: 16px; 
            color: #fff;
            font-family: 'Sono', sans-serif;
            font-variation-settings: 'MONO' 0;
        }
        
        #wrapper-render {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            margin: 5px 0 0 0;
        }
        
        /* Panel Flotante y Controles */
        #panel-flotante-wrapper {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            z-index: 999;
        }
        
        .fila-inferior,
        .panel-scroll-flotante {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .panel-scroll-flotante { 
            background: rgba(20, 20, 20, 0.95); 
            border: 1px solid #333; 
            padding: 12px 25px; 
            border-radius: 30px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); 
            backdrop-filter: blur(5px); 
        }
        
        .btn-scroll,
        .btn-transponer,
        .btn-toggle-transponer {
            font-family: 'Sono', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
        }
        
        .btn-scroll { 
            background: var(--accent); 
            border: none; 
            color: #000; 
            width: 36px; 
            height: 36px; 
            font-size: 14px; 
        }
        
        .btn-scroll.activo { 
            background: #ff3333; 
            color: #fff;
        }
        
        .btn-transponer {
            background: #fff;
            color: #111;
            border: none;
            width: 36px; 
            height: 36px; 
            font-size: 14px; 
            transition: background 0.15s;
        }

        #btn-reset-tono {
            background: var(--accent);
        }
        
        .btn-transponer:hover {
            background: #ddd;
        }

        .btn-toggle-transponer {
            background: rgba(20, 20, 20, 0.95); 
            border: 1px solid #333; 
            color: #fff;
            height: 62px;
            width: 62px;
            padding: 0 16px;
            border-radius: 30px;
            font-size: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px); 
            transition: color 0.15s, border-color 0.15s;
        }

        .btn-toggle-transponer.abierto {
            color: var(--accent);
            border-color: var(--accent);
        }
        
        .slider-scroll { 
            width: 100px; 
            accent-color: var(--accent); 
        }

        @media (max-width: 600px) {
            .caja-acorde-emergente {
                padding: 8px 12px;
                border-radius: 10px;
            }

            .caja-acorde-emergente h4 {
                font-size: 14px;
                margin-bottom: 2px;
            }

            .titulo-row {
                flex-wrap: wrap;
                gap: 8px;
            }

            .badge-capo {
                font-size: 12px;
                padding: 4px 10px;
            }

            .badge-capo svg {
                width: 15px;
                height: 15px;
            }

            .contenedor-audio {
                padding: 10px 14px;
            }
        }
        
        @media (max-width: 1300px) {
            body { 
                padding: 40px 15px 100px 15px;
            }
        
            .workspace { 
                display: flex;
                flex-direction: column-reverse; 
                gap: 20px;
            }
        
            .letra-contenedor {
                padding: 20px; 
            }
        
            .letra-texto {
                line-height: 1.5;
                letter-spacing: -0.3px;
            }
        }
    </style>
    <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>
    <div class="container">
        <a id="link-regreso" href="." class="btn-volver">← Volver al cancionero</a>

        <div class="info-cabecera">
            <div class="titulo-row">
                <h1 id="titulo-cancion">Cargando...</h1>
                <div id="badge-capo" class="badge-capo" style="display: none;">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <rect x="3" y="4" width="18" height="4" rx="1.5" fill="currentColor"/>
                        <path d="M6 8v11a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2V8" stroke="currentColor" stroke-width="2" fill="none"/>
                        <path d="M18 8v6a2 2 0 0 1-2 2h-1" stroke="currentColor" stroke-width="2" fill="none"/>
                    </svg>
                    <span id="texto-capo"></span>
                </div>
            </div>
            <h2 id="nombre-artista"></h2>
        </div>

        <div id="contenedor-audio" class="contenedor-audio" style="display: none;">
            <audio id="reproductor-audio" controls preload="metadata">
                Tu navegador no soporta el elemento de audio.
            </audio>
        </div>

        <div class="workspace">
            <article class="letra-contenedor">
                <pre id="letra-cancion" class="letra-texto">Abriendo canción...</pre>
            </article>
        </div>
    </div>

    <div id="caja-acorde" class="caja-acorde-emergente">
       <h4 id="acorde-titulo"></h4>
       <span id="origen-acorde-modal" style="font-size:10px; opacity:0.6; display:block; margin-bottom:4px;"></span>
       <div id="wrapper-render"></div> 
    </div>
    
    <div id="panel-flotante-wrapper">
        <div id="panel-transponer" class="panel-scroll-flotante" style="display:none;">
            <button id="btn-bajar-tono" class="btn-transponer" title="Bajar 1 tono">−1</button>
            <button id="btn-bajar-medio" class="btn-transponer" title="Bajar medio tono">−½</button>
            <button id="btn-subir-medio" class="btn-transponer" title="Subir medio tono">+½</button>
            <button id="btn-subir-tono" class="btn-transponer" title="Subir 1 tono">+1</button>
            <button id="btn-reset-tono" class="btn-transponer" title="Volver a la tonalidad original">↺</button>
        </div>

        <div class="fila-inferior">
            <div id="panel-scroll" class="panel-scroll-flotante">
                <button id="btn-play-scroll" class="btn-scroll">▶</button>
                <input type="range" id="slider-velocidad" class="slider-scroll" min="1" max="10" value="5">
            </div>
            <button id="btn-toggle-transponer" class="btn-toggle-transponer" title="Transponer">—</button>
        </div>
    </div>

    <script src="js/acordes.js"></script>

    <script type="module">
        import { obtenerContenidoCancion } from './js/api-cliente.js';
        import { procesarLetraYAcordes, inicializarModalAcordes } from './js/modulo-acordes.js';
        import { inyectarReproductor } from './js/modulo-reproductor.js';
        import { inicializarAutoscroll } from './js/modulo-autoscroll.js';
        import { inicializarTransponer } from './js/modulo-transponer.js';

        const params = new URLSearchParams(window.location.search);
        const idC = params.get('idC');

        const letraCancionDiv = document.getElementById('letra-cancion');

        // Formatos de audio soportados para búsqueda dinámica
        const FORMATOS_AUDIO = [
            { ext: 'mp3', mime: 'audio/mpeg' },
            { ext: 'm4a', mime: 'audio/mp4' },
            { ext: 'wav', mime: 'audio/wav' },
            { ext: 'ogg', mime: 'audio/ogg' },
            { ext: 'aac', mime: 'audio/aac' },
            { ext: 'flac', mime: 'audio/flac' },
            { ext: 'opus', mime: 'audio/opus' },
            { ext: 'webm', mime: 'audio/webm' }
        ];

        async function buscarYCarGarGrabacion(nombreCancion) {
            const contenedorAudio = document.getElementById('contenedor-audio');
            const reproductorAudio = document.getElementById('reproductor-audio');
            
            // Elimina paréntesis y su contenido, elimina guiones (-), y limpia espacios sobrantes
            const nombreLimpio = nombreCancion
                .replace(/\(.*?\)/g, '')
                .replace(/-/g, '')
                .replace(/\s+/g, ' ')
                .trim();

            const nombreEncoded = encodeURIComponent(nombreLimpio);

            for (const formato of FORMATOS_AUDIO) {
                const rutaArchivo = `Grabaciones/${nombreEncoded}.${formato.ext}`;
                try {
                    const respuesta = await fetch(rutaArchivo, { method: 'HEAD' });
                    if (respuesta.ok) {
                        reproductorAudio.innerHTML = `<source src="${rutaArchivo}" type="${formato.mime}">Tu navegador no soporta el elemento de audio.`;
                        reproductorAudio.load();
                        contenedorAudio.style.display = 'block';
                        return;
                    }
                } catch (e) {
                    // Si ocurre un error de red o de política CORS, continuar probando el siguiente formato
                }
            }

            // Si no se encuentra ningún archivo de grabación en los formatos lista, ocultar el contenedor
            contenedorAudio.style.display = 'none';
        }

        async function cargarPlantilla() {
            if(!idC) {
                letraCancionDiv.textContent = "Error: No se definió el identificador de la canción.";
                return;
            }

            try {
                const data = await obtenerContenidoCancion(idC);
                if (data.error) { letraCancionDiv.textContent = "Error: " + data.error; return; }

                document.getElementById('titulo-cancion').textContent = data.nombreC;
                document.getElementById('nombre-artista').textContent = data.arreglos ? `Arreglos: ${data.arreglos}` : '';

                // Búsqueda dinámica de la grabación de audio en múltiples formatos
                if (data.nombreC) {
                    buscarYCarGarGrabacion(data.nombreC);
                }

                // Detección y extracción del Capo
                let contenidoProcesar = data.contenido || "";
                const matchCapo = contenidoProcesar.match(/Capo:\s*#?\s*(\d+)/i);
                const badgeCapo = document.getElementById('badge-capo');
                const textoCapo = document.getElementById('texto-capo');

                if (matchCapo) {
                    const numeroCapo = matchCapo[1];
                    if (badgeCapo && textoCapo) {
                        textoCapo.textContent = `Capo: ${numeroCapo}º traste`;
                        badgeCapo.style.display = 'inline-flex';
                    }

                    // Borrar las primeras 2 líneas para ocultar la indicación
                    const lineas = contenidoProcesar.split(/\r?\n/);
                    if (lineas.length > 0 && /Capo:/i.test(lineas[0])) {
                        lineas.splice(0, Math.min(2, lineas.length));
                        contenidoProcesar = lineas.join('\n');
                    } else {
                        contenidoProcesar = contenidoProcesar.replace(/^.*Capo:\s*#?\s*\d+.*(?:\r?\n)?/im, '');
                    }
                } else {
                    if (badgeCapo) badgeCapo.style.display = 'none';
                }

                // 1. Procesamiento e inyección de la letra y acordes interactivos
                letraCancionDiv.innerHTML = procesarLetraYAcordes(contenidoProcesar);
                inicializarModalAcordes('caja-acorde');

                // 2. LLAMADA MODULAR AL REPRODUCTOR
                const datosContexto = { nombreC: data.nombreC };
                inyectarReproductor('.wrapper-iframe', data.ytID, datosContexto);

                // 3. Inicializar autoscroll
                inicializarAutoscroll('btn-play-scroll', 'slider-velocidad');

                // 4. Menú de transposición
                inicializarTransponer({
                    contenidoOriginal: contenidoProcesar,
                    onRetransponer: (texto) => {
                        letraCancionDiv.innerHTML = procesarLetraYAcordes(texto);
                    },
                    tonalidadLabelId: 'btn-toggle-transponer',
                    btnSubirTonoId: 'btn-subir-tono',
                    btnSubirMedioId: 'btn-subir-medio',
                    btnBajarMedioId: 'btn-bajar-medio',
                    btnBajarTonoId: 'btn-bajar-tono',
                    btnResetId: 'btn-reset-tono',
                    btnToggleId: 'btn-toggle-transponer',
                    panelId: 'panel-transponer'
                });

            } catch (err) {
                console.error(err);
                letraCancionDiv.textContent = "Error crítico al descargar el contenido de la canción.";
            }
        }

        cargarPlantilla();
    </script>
</body>
</html>
