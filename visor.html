<!DOCTYPE html>
<html lang="es-mx">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="img/icono.png">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sono:MONO@0..1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0&display=swap" />
    <link rel="stylesheet" href="style.css">
    <title>Visor de Letra y Acordes</title>
</head>
<body>
    <div class="container">
        <div class="header-superior">
            <a href="index.html" class="btn-volver-admin">← Volver al inicio</a>
        </div>
        <div class="info-cabecera">
            <div class="titulo-row">
                <h1 id="titulo-cancion">Cargando...</h1>
            </div>
            <h2 id="nombre-artista"></h2>
        </div>
        <div class="workspace">
            <article id="letra-contenedor" class="letra-contenedor">
                <pre id="letra-cancion" class="letra-texto">Abriendo canción...</pre>
            </article>
        </div>
    </div>
    <div id="caja-acorde" class="caja-acorde-emergente" style="display:none;">
       <h4 id="acorde-titulo"></h4>
       <div id="wrapper-render"></div>
    </div>
    <script type="module">
        import { obtenerContenidoCancion } from './js/core-app.js';
        import { procesarLetraYAcordes, inicializarModalAcordes } from './js/core-acordes.js';
        const params = new URLSearchParams(window.location.search);
        const idC = params.get('idC');
        async function cargar() {
            if(!idC) return;
            const data = await obtenerContenidoCancion(idC);
            if (data.error) return;
            document.getElementById('titulo-cancion').textContent = data.nombreC;
            document.getElementById('nombre-artista').textContent = data.arreglos || '';
            document.getElementById('letra-cancion').innerHTML = procesarLetraYAcordes(data.contenido || '');
            inicializarModalAcordes('caja-acorde');
        }
        cargar();
    </script>
</body>
</html>
