<!DOCTYPE html>
<html lang="es-mx">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="img/icono.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sono:MONO@0..1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0&display=swap" />
    <link href="style.css" rel="stylesheet">
    <title>Gestor de Avisos</title>
    <style>
        body { 
            max-width: 80%; 
            margin: 0 auto; 
            font-family: 'Sono', monospace; 
            padding-bottom: 40px; 
            background-color: #0d0d0d;
        }
        header { 
            margin-bottom: 20px; 
            border-bottom: 2px solid var(--accent); 
            padding-bottom: 10px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            flex-wrap: wrap; 
            gap: 10px; 
        }
        h1 { 
            margin: 0; 
            font-size: 32px; 
            font-weight: 700; 
            color: var(--text-main); 
        }
        .btn-accion { 
            background-color: var(--accent); 
            color: #0d0d0d; 
            border: none; 
            padding: 10px 18px; 
            border-radius: 12px; 
            font-family: 'Sono', monospace; 
            font-size: 14px; 
            font-weight: bold; 
            cursor: pointer; 
            display: inline-flex; 
            align-items: center; 
            gap: 8px; 
            text-decoration: none; 
        }
        .btn-accion:hover { 
            filter: brightness(1.1); 
        }
        .btn-secundario {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 2px solid var(--accent);
            padding: 10px 18px;
            border-radius: 12px;
            font-family: 'Sono', monospace;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-secundario:hover {
            background-color: var(--card-bg);
            border-color: #ffffff;
        }
        .btn-grupo-acciones {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn-eliminar { 
            background-color: #e71d36; 
            color: #ffffff; 
            border: none; 
            border-radius: 10px; 
            padding: 8px 14px; 
            font-family: 'Sono', monospace; 
            font-size: 13px; 
            font-weight: bold; 
            cursor: pointer; 
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
            gap: 6px; 
        }
        .btn-editar {
            background-color: var(--card-bg);
            color: var(--accent);
            border: 2px solid var(--accent);
            border-radius: 10px;
            padding: 8px 14px;
            font-family: 'Sono', monospace;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-editar:hover {
            background-color: var(--accent);
            color: #0d0d0d;
        }
        
        .formulario-aviso { 
            background-color: #1E1E24 !important; 
            border-radius: 20px; 
            padding: 24px; 
            margin-bottom: 30px; 
            display: flex; 
            flex-direction: column; 
            gap: 16px; 
            border: 2px solid var(--accent); 
            opacity: 1 !important;
        }
        .formulario-aviso h2 { 
            margin: 0 0 10px 0; 
            font-size: 20px; 
            color: var(--text-main); 
            border-bottom: 2px solid var(--accent); 
            padding-bottom: 8px; 
        }
        .grupo-campo { 
            display: flex; 
            flex-direction: column; 
            gap: 6px; 
        }
        .grupo-campo label { 
            font-size: 12px; 
            color: var(--text-sec); 
            text-transform: uppercase; 
            letter-spacing: 0.5px; 
        }

        .input-texto, .textarea-texto { 
            width: 100%; 
            background-color: #16161b !important; 
            color: var(--text-main) !important; 
            border: 2px solid var(--accent); 
            border-radius: 12px; 
            padding: 10px 16px; 
            font-family: 'Sono', monospace; 
            font-size: 14px; 
            outline: none; 
            box-sizing: border-box; 
            opacity: 1 !important;
        }
        .textarea-texto { 
            resize: vertical; 
            min-height: 100px; 
        }
        .input-texto:focus, .textarea-texto:focus { 
            border-color: #ffffff; 
        }

        .grid-avisos { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 16px; 
        }
        .tarjeta-aviso-admin { 
            background-color: #1E1E24 !important; 
            border-radius: 16px; 
            padding: 16px; 
            border: 2px solid #1E1E24; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            gap: 12px; 
            opacity: 1 !important;
        }
        .tarjeta-aviso-admin:hover { 
            border-color: var(--accent); 
        }
        .tarjeta-aviso-admin h3 { 
            margin: 0; 
            font-size: 18px; 
            color: var(--text-main); 
        }
        .tarjeta-aviso-admin .meta { 
            font-size: 12px; 
            color: var(--accent); 
            font-weight: bold; 
        }
        .tarjeta-aviso-admin p { 
            margin: 0; 
            font-size: 13px; 
            color: var(--text-sec); 
            white-space: pre-line; 
        }
        .cargando { 
            text-align: center; 
            color: var(--accent); 
            padding: 40px; 
            grid-column: 1 / -1; 
        }
        @media (max-width: 600px) { 
            body { max-width: 92%; } 
            h1 { font-size: 24px; } 
        }
    </style>
</head>
<body>
    <header>
        <div>
            <h1>Gestión de Avisos</h1>
            <p style="margin: 5px 0 0 0; font-size: 13px; color: var(--text-sec);">Publica y administra los avisos para la aplicación</p>
        </div>
    </header>

    <main>
        <div class="formulario-aviso">
            <h2 id="titulo-formulario">Nuevo Aviso</h2>
            <div class="grupo-campo">
                <label for="input-titulo">Título del Aviso</label>
                <input type="text" id="input-titulo" class="input-texto" placeholder="Ej. Ensayo general obligatorio" autocomplete="off">
            </div>
            <div class="grupo-campo">
                <label for="input-fecha">Fecha (Opcional)</label>
                <input type="date" id="input-fecha" class="input-texto">
            </div>
            <div class="grupo-campo">
                <label for="textarea-texto">Contenido del Aviso</label>
                <textarea id="textarea-texto" class="textarea-texto" placeholder="Escribe los detalles del aviso aquí..."></textarea>
            </div>
            <div class="btn-grupo-acciones">
                <button id="btn-guardar" class="btn-accion">
                    <span class="material-symbols-outlined">save</span> <span id="texto-btn-guardar">Publicar Aviso</span>
                </button>
                <button id="btn-cancelar-edicion" class="btn-secundario" style="display: none;">
                    <span class="material-symbols-outlined">close</span> Cancelar Edición
                </button>
            </div>
        </div>

        <div class="titulo-seccion" style="font-size: 18px; margin-bottom: 12px; color: var(--text-main);">
            <span class="material-symbols-outlined">campaign</span> Avisos Publicados
        </div>
        <div id="grid-avisos" class="grid-avisos">
            <div class="cargando">Cargando avisos...</div>
        </div>
    </main>

    <script type="module">
        import { protegerPaginaAdmin } from './js/auth-guard.js';
        import { getDatabase, ref, push, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        protegerPaginaAdmin((user) => {
            const db = getDatabase();

            const inputTitulo = document.getElementById('input-titulo');
            const inputFecha = document.getElementById('input-fecha');
            const textareaTexto = document.getElementById('textarea-texto');
            const btnGuardar = document.getElementById('btn-guardar');
            const textoBtnGuardar = document.getElementById('texto-btn-guardar');
            const btnCancelarEdicion = document.getElementById('btn-cancelar-edicion');
            const tituloFormulario = document.getElementById('titulo-formulario');
            const gridAvisos = document.getElementById('grid-avisos');

            let idAvisoEditando = null;

            const hoy = new Date();
            inputFecha.value = `\${hoy.getFullYear()}-${String(hoy.getMonth() + 1).padStart(2, '0')}-${String(hoy.getDate()).padStart(2, '0')}`;

            function limpiarFormulario() {
                idAvisoEditando = null;
                inputTitulo.value = '';
                textareaTexto.value = '';
                inputFecha.value = `\${hoy.getFullYear()}-${String(hoy.getMonth() + 1).padStart(2, '0')}-${String(hoy.getDate()).padStart(2, '0')}`;
                tituloFormulario.textContent = 'Nuevo Aviso';
                textoBtnGuardar.textContent = 'Publicar Aviso';
                btnCancelarEdicion.style.display = 'none';
            }

            btnCancelarEdicion.addEventListener('click', limpiarFormulario);

            btnGuardar.addEventListener('click', async () => {
                const titulo = inputTitulo.value.trim();
                const fecha = inputFecha.value;
                const texto = textareaTexto.value.trim();

                if (!titulo || !texto) {
                    alert("Por favor completa el título y el contenido del aviso.");
                    return;
                }

                try {
                    if (idAvisoEditando) {
                        await set(ref(db, `anuncios/\${idAvisoEditando}`), {
                            idA: idAvisoEditando,
                            titulo,
                            fecha,
                            texto
                        });
                        alert("¡Aviso actualizado con éxito!");
                    } else {
                        const avisosRef = ref(db, 'anuncios');
                        const nuevoAvisoRef = push(avisosRef);
                        await set(nuevoAvisoRef, {
                            idA: nuevoAvisoRef.key,
                            titulo,
                            fecha,
                            texto
                        });
                        alert("¡Aviso publicado con éxito!");
                    }

                    limpiarFormulario();
                } catch (err) {
                    console.error("Error al guardar aviso:", err);
                    alert("No se pudo guardar el aviso.");
                }
            });

            function cargarAvisosAdmin() {
                const avisosRef = ref(db, 'anuncios');
                onValue(avisosRef, (snapshot) => {
                    const datos = snapshot.val();
                    gridAvisos.innerHTML = '';

                    if (!datos) {
                        gridAvisos.innerHTML = '<div class="cargando">No hay avisos publicados.</div>';
                        return;
                    }

                    const lista = Object.entries(datos).map(([key, val]) => ({ idA: key, ...val }));
                    lista.sort((a, b) => (b.fecha || '').localeCompare(a.fecha || ''));

                    const fragmento = document.createDocumentFragment();
                    lista.forEach(aviso => {
                        const tarjeta = document.createElement('div');
                        tarjeta.className = 'tarjeta-aviso-admin';

                        let htmlMeta = '';
                        if (aviso.fecha) {
                            htmlMeta = `<span class="meta">\${aviso.fecha}</span>`;
                        }

                        tarjeta.innerHTML = `
                            <div>
                                <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px;">
                                    <h3>${aviso.titulo}</h3>${htmlMeta}
                                </div>
                                <p>\${aviso.texto || aviso.contenido || ''}</p>
                            </div>
                            <div style="display: flex; gap: 8px; margin-top: 8px;">
                                <button class="btn-editar" data-id="\${aviso.idA}">
                                    <span class="material-symbols-outlined" style="font-size:16px;">edit</span> Editar
                                </button>
                                <button class="btn-eliminar" data-id="\${aviso.idA}">
                                    <span class="material-symbols-outlined" style="font-size:16px;">delete</span> Eliminar
                                </button>
                            </div>
                        `;

                        tarjeta.querySelector('.btn-editar').addEventListener('click', () => {
                            idAvisoEditando = aviso.idA;
                            inputTitulo.value = aviso.titulo || '';
                            inputFecha.value = aviso.fecha || '';
                            textareaTexto.value = aviso.texto || aviso.contenido || '';
                            tituloFormulario.textContent = 'Editar Aviso';
                            textoBtnGuardar.textContent = 'Actualizar Aviso';
                            btnCancelarEdicion.style.display = 'inline-flex';
                            window.scrollTo({ top: 0, behavior: 'smooth' });
                        });

                        tarjeta.querySelector('.btn-eliminar').addEventListener('click', async () => {
                            if (confirm(`¿Estás seguro de eliminar el aviso "\${aviso.titulo}"?`)) {
                                try {
                                    await remove(ref(db, `anuncios/\${aviso.idA}`));
                                    if (idAvisoEditando === aviso.idA) {
                                        limpiarFormulario();
                                    }
                                } catch (e) {
                                    alert("No se pudo eliminar el aviso.");
                                }
                            }
                        });

                        fragmento.appendChild(tarjeta);
                    });

                    gridAvisos.appendChild(fragmento);
                }, () => {
                    gridAvisos.innerHTML = '<div class="cargando">Error al cargar avisos.</div>';
                });
            }

            cargarAvisosAdmin();
        });
    </script>
</body>
</html>
