<!DOCTYPE html>
<html lang="es-mx">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/x-icon" href="img/icono.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sono:MONO@0..1&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0&display=swap" />

    <link href="style.css" rel="stylesheet">
    <title>Detalles del Evento</title>
    <style>
        body {
            position: relative;
            max-width: 80%;
            margin: 0 auto;
            padding-bottom: 60px;
        }

        @keyframes fadeInImagen {
            0% { opacity: 0; }
            100% { opacity: 0.18; }
        }

        body::before {
            content: "";
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70%;
            height: 70%;
            background-image: url('img/fondo.png');
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            opacity: 0;
            pointer-events: none;
            z-index: 0;
            will-change: opacity;
            animation: fadeInImagen 0.6s ease-out forwards;
        }

        @keyframes deslizarTexto {
            0% { opacity: 0; transform: translateY(-10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined' !important;
            user-select: none;
            font-weight: normal !important;
            font-style: normal !important;
            font-feature-settings: 'liga';
            -webkit-font-feature-settings: 'liga';
            visibility: hidden;
            opacity: 0;
            width: 1em;
            height: 1em;
            display: inline-block;
            text-align: center;
            overflow: hidden;
            white-space: nowrap;
            will-change: transform, opacity, visibility;
        }

        .icono-grabacion,
        .icono-general {
            visibility: hidden;
            opacity: 0;
            width: 1em;
            height: 1em;
            display: inline-block;
            overflow: hidden;
            white-space: nowrap;
            will-change: transform, opacity, visibility;
        }

        .fuente-cargada {
            visibility: visible !important;
            animation: popIconoPlay 0.25s cubic-bezier(0.34, 1.56, 0.64, 1) forwards !important;
        }

        @keyframes popIconoPlay {
            0% { opacity: 0; transform: scale(0.2); }
            70% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }

        header {
            position: relative;
            z-index: 100;
            isolation: isolate;
            margin: 0 auto 20px auto;
        }

        h1 {
            margin: 0;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
            opacity: 0;
            will-change: transform, opacity;
            animation: deslizarTexto 0.25s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        p.subtitulo {
            margin: 5px 0 0 0;
            font-size: 13px;
            color: var(--text-sec);
            border-bottom: 2px solid var(--accent);
            padding-bottom: 10px;
            margin-bottom: 20px;
            opacity: 0;
            will-change: transform, opacity;
            animation: deslizarTexto 0.25s cubic-bezier(0.34, 1.56, 0.64, 1) 0.08s forwards;
        }

        @keyframes extenderContenedor {
            0% { opacity: 0; transform: scaleY(0.85); transform-origin: top; }
            70% { opacity: 1; transform: scaleY(1.015); transform-origin: top; }
            100% { opacity: 1; transform: scaleY(1); transform-origin: top; }
        }

        .tarjeta-detalle-evento {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 25px;
            position: relative;
            z-index: 1;
            opacity: 0;
            will-change: transform, opacity;
            animation: extenderContenedor 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.15) forwards;
        }

        .item-info {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            color: var(--text-main);
            font-family: 'Sono', monospace;
        }

        .item-info .material-symbols-outlined {
            color: var(--accent);
            font-size: 22px;
            flex-shrink: 0;
        }

        .item-info-contenido {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .item-info-etiqueta {
            font-size: 11px;
            color: var(--text-sec);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .bloque-notas {
            background: rgba(188, 151, 49, 0.12);
            border: 1px solid var(--accent);
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 13px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Sono', monospace;
        }

        .bloque-notas .material-symbols-outlined {
            color: var(--accent);
            font-size: 20px;
            flex-shrink: 0;
        }

        .link-lugar {
            color: var(--accent) !important;
            text-decoration: underline;
            text-underline-offset: 3px;
            width: fit-content;
            transition: opacity 0.15s;
            position: relative;
            z-index: 5;
            cursor: pointer;
            display: inline-block;
        }

        .link-lugar:hover { opacity: 0.85; }
        .link-lugar:active { opacity: 0.65; }

        .tarjeta-asistencia {
            background-color: #1e1e24;
            border-radius: 20px;
            padding: 20px 24px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            font-family: 'Sono', monospace;
            position: relative;
            z-index: 2;
        }

        .header-asistencia {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .header-asistencia h3 {
            margin: 0;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-main);
        }

        .btn-confirmar-main {
            background-color: var(--accent);
            color: var(--bg-color);
            border: none;
            padding: 8px 16px;
            border-radius: 12px;
            font-family: 'Sono', monospace;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: transform 0.15s, opacity 0.15s;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-confirmar-main:active { transform: scale(0.97); }

        .lista-asistentes {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .item-asistente {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            background-color: #2a2a32;
            border-radius: 10px;
            font-size: 13px;
            color: var(--text-main);
        }

        .badge-estado {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-estado.asistira { color: #2ec4b6; }
        .badge-estado.no-asistira { color: #e71d36; }

        .modal-rsvp-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-rsvp-overlay.activo { display: flex; }

        .modal-rsvp-card {
            background-color: #1e1e24;
            border: 2px solid var(--accent);
            border-radius: 20px;
            padding: 24px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            gap: 16px;
            font-family: 'Sono', monospace;
        }

        .modal-rsvp-card h4 {
            margin: 0;
            font-size: 18px;
            color: var(--text-main);
        }

        .input-nombre-rsvp {
            background-color: #121215;
            color: var(--text-main);
            border: 1px solid var(--accent);
            border-radius: 10px;
            padding: 10px 14px;
            font-family: 'Sono', monospace;
            font-size: 14px;
            outline: none;
            width: 100%;
            box-sizing: border-box;
        }

        .acciones-modal-rsvp {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .btn-opcion-rsvp {
            border: none;
            padding: 10px 14px;
            border-radius: 10px;
            font-family: 'Sono', monospace;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn-opcion-asistir { background-color: #2ec4b6; color: #fff; }
        .btn-opcion-faltar { background-color: #e71d36; color: #fff; }
        .btn-opcion-cancelar { background-color: transparent; color: var(--text-sec); }

        .titulo-seccion {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-main);
            margin: 20px 0 12px 0;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Sono', monospace;
        }

        .lista-canciones-repertorio {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            margin: 0 auto;
        }

        @media (min-width: 600px) {
            .lista-canciones-repertorio { grid-template-columns: repeat(2, 1fr); }
        }
        @media (min-width: 900px) {
            .lista-canciones-repertorio { grid-template-columns: repeat(3, 1fr); }
        }
        @media (min-width: 1200px) {
            .lista-canciones-repertorio { grid-template-columns: repeat(4, 1fr); }
        }

        @keyframes popWiiU {
            0% { opacity: 0; transform: translate(-15px, -15px) scale(0.75); }
            75% { opacity: 1; transform: translate(2px, 2px) scale(1.03); }
            100% { opacity: 1; transform: translate(0, 0) scale(1); }
        }

        .fila-cancion {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 16px 20px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.15s;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            position: relative;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden;
            
            opacity: 0;
            will-change: transform, opacity;
            animation: popWiiU 0.22s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @media (hover: hover) {
            .fila-cancion:hover {
                transform: scale(1.05);
                box-shadow: 0 6px 16px rgba(0,0,0,0.25);
                z-index: 2;
            }
        }
        
        .fila-cancion:active { transform: scale(1.05); }

        .fila-cancion h2 {
            margin: 0 0 12px 0;
            gap: 10px;
            padding-bottom: 8px;
            font-size: 18px;
            font-weight: 600;
            border-bottom: 2px solid var(--accent);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .contenedor-iconos-header {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .icono-grabacion {
            font-family: 'Material Symbols Outlined' !important;
            font-size: 20px;
            color: var(--accent);
            user-select: none;
            font-weight: normal !important;
            font-style: normal !important;
            font-feature-settings: 'liga';
            -webkit-font-feature-settings: 'liga';
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24 !important;
        }

        .estado-icono {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .estado-icono.terminada {
            background-color: #2ec4b6;
            box-shadow: 0 0 8px rgba(46, 196, 182, 0.5);
        }

        .estado-icono.revisar {
            background-color: #f5c518;
            box-shadow: 0 0 8px rgba(245, 197, 24, 0.5);
        }

        .estado-icono.pendiente {
            background-color: #e71d36;
            box-shadow: 0 0 8px rgba(231, 29, 54, 0.5);
        }

        .fila-cancion .meta {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 13px;
            color: var(--text-sec);
        }

        .cargando {
            text-align: center;
            color: var(--accent);
            padding: 40px;
            font-family: 'Sono', monospace;
        }

        @media (max-width: 1300px) {
            body { padding-left: 23px; padding-right: 23px; }
        }
    </style>
</head>
<body>
    <header>
        <h1 id="titulo-evento">Cargando evento...</h1>
        <p class="subtitulo">Rondalla Perla De Horus</p>
    </header>

    <main>
        <div id="contenedor-detalle">
            <div class="cargando">Cargando detalles del evento...</div>
        </div>

        <!-- Tarjeta de Confirmación de Asistencia -->
        <div id="seccion-asistencia" class="tarjeta-asistencia" style="display: none;">
            <div class="header-asistencia">
                <h3><span class="material-symbols-outlined">how_to_reg</span> Asistencia</h3>
                <button id="btn-abrir-rsvp" class="btn-confirmar-main">
                    <span class="material-symbols-outlined" style="font-size: 18px;">edit</span> Confirmar asistencia
                </button>
            </div>
            <div id="lista-asistentes" class="lista-asistentes"></div>
        </div>

        <div id="seccion-repertorio" style="display: none;">
            <div class="titulo-seccion">
                <span class="material-symbols-outlined">queue_music</span> Repertorio Programado
            </div>
            <div id="lista-repertorio" class="lista-canciones-repertorio"></div>
        </div>
    </main>

    <!-- Modal para ingresar el nombre -->
    <div id="modal-rsvp" class="modal-rsvp-overlay">
        <div class="modal-rsvp-card">
            <h4>Confirmar Asistencia</h4>
            <input type="text" id="input-nombre-rsvp" class="input-nombre-rsvp" placeholder="Escribe tu nombre..." autocomplete="off">
            <div class="acciones-modal-rsvp">
                <button id="btn-cancelar-rsvp" class="btn-opcion-rsvp btn-opcion-cancelar">Cancelar</button>
                <button id="btn-faltar-rsvp" class="btn-opcion-rsvp btn-opcion-faltar">
                    <span class="material-symbols-outlined" style="font-size: 16px;">cancel</span> No podré ir
                </button>
                <button id="btn-asistir-rsvp" class="btn-opcion-rsvp btn-opcion-asistir">
                    <span class="material-symbols-outlined" style="font-size: 16px;">check_circle</span> Asistiré
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        import { obtenerCanciones, obtenerContenidoCancion } from './js/api-cliente.js';
        import { detectarTonalidad, nombreTonalidad } from './js/modulo-transponer.js';

        // Configuración de Firebase (Reemplaza con las credenciales de tu consola)
        const firebaseConfig = {
            apiKey: "AIzaSyA3g3DmWC_mYrA2RFj75sOoX9kolmzKINA",
            authDomain: "rondalla-f04a4.firebaseapp.com",
            databaseURL: "https://rondalla-f04a4-default-rtdb.firebaseio.com",
            projectId: "rondalla-f04a4",
            storageBucket: "rondalla-f04a4.firebasestorage.app",
            messagingSenderId: "835273996097",
            appId: "1:835273996097:web:f1258c2f461ef6613513c0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const params = new URLSearchParams(window.location.search);
        const idE = params.get('idE');

        const tituloEventoEl = document.getElementById('titulo-evento');
        const contenedorDetalleEl = document.getElementById('contenedor-detalle');
        const seccionRepertorioEl = document.getElementById('seccion-repertorio');
        const listaRepertorioEl = document.getElementById('lista-repertorio');

        const seccionAsistenciaEl = document.getElementById('seccion-asistencia');
        const listaAsistentesEl = document.getElementById('lista-asistentes');
        const btnAbrirRsvp = document.getElementById('btn-abrir-rsvp');
        const modalRsvp = document.getElementById('modal-rsvp');
        const inputNombreRsvp = document.getElementById('input-nombre-rsvp');
        const btnCancelarRsvp = document.getElementById('btn-cancelar-rsvp');
        const btnAsistirRsvp = document.getElementById('btn-asistir-rsvp');
        const btnFaltarRsvp = document.getElementById('btn-faltar-rsvp');

        const FORMATOS_AUDIO = ['mp3', 'm4a', 'wav', 'ogg', 'aac', 'flac', 'opus', 'webm'];

        function activarAnimacionIconos() {
            document.fonts.ready.then(() => {
                document.querySelectorAll('.material-symbols-outlined, .icono-grabacion').forEach(icono => {
                    icono.classList.add('fuente-cargada');
                });
            });
        }

        function normalizarUrl(url) {
            if (!url) return '#';
            const limpia = url.trim();
            if (/^https?:\/\//i.test(limpia)) return limpia;
            return `https://${limpia}`;
        }

        function obtenerNumColumnas() {
            const ancho = window.innerWidth;
            if (ancho >= 1200) return 4;
            if (ancho >= 900) return 3;
            if (ancho >= 600) return 2;
            return 1;
        }

        function formatearHoraAMPM(horaStr) {
            if (!horaStr) return '';
            if (horaStr.toLowerCase().includes('a.m') || horaStr.toLowerCase().includes('p.m')) {
                return horaStr;
            }
            const partes = horaStr.split(':');
            if (partes.length < 2) return horaStr;

            let hrs = parseInt(partes[0], 10);
            const mins = partes[1].trim();
            if (isNaN(hrs)) return horaStr;

            const ampm = hrs >= 12 ? 'p.m.' : 'a.m.';
            hrs = hrs % 12;
            if (hrs === 0) hrs = 12;

            return `${hrs}:${mins}${ampm}`;
        }

        function formatearFechaYHorarioDetalle(stringFecha, horaInicio, horaFin) {
            if (!stringFecha) return '—';
            const partes = stringFecha.split('-');
            let textoFecha = stringFecha;

            if (partes.length === 3) {
                const d = new Date(partes[0], partes[1] - 1, partes[2]);
                textoFecha = d.toLocaleDateString('es-MX', { 
                    weekday: 'long', 
                    day: 'numeric', 
                    month: 'long', 
                    year: 'numeric' 
                });
                textoFecha = textoFecha.charAt(0).toUpperCase() + textoFecha.slice(1);
            }

            const inicioFormatted = formatearHoraAMPM(horaInicio);
            const finFormatted = formatearHoraAMPM(horaFin);

            let rangoHoras = '';
            if (inicioFormatted && finFormatted) {
                rangoHoras = `${inicioFormatted}-${finFormatted}`;
            } else if (inicioFormatted) {
                rangoHoras = inicioFormatted;
            }

            return rangoHoras ? `${textoFecha} (${rangoHoras})` : textoFecha;
        }

        // Suscripción Global a Firebase en tiempo real
        function conectarAsistenciasFirebase() {
            if (!idE) return;
            const rsvpRef = ref(db, `asistencias/${idE}`);

            onValue(rsvpRef, (snapshot) => {
                const datos = snapshot.val();
                listaAsistentesEl.innerHTML = '';

                if (!datos) {
                    listaAsistentesEl.innerHTML = '<div style="font-size:12px; color:var(--text-sec);">Aún no hay confirmaciones grabadas.</div>';
                    return;
                }

                Object.values(datos).forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'item-asistente';

                    const esAsiste = item.estado === 'asistira';
                    const icono = esAsiste ? 'check_circle' : 'cancel';
                    const texto = esAsiste ? 'Asistirá' : 'No asistirá';
                    const clase = esAsiste ? 'asistira' : 'no-asistira';

                    div.innerHTML = `
                        <span>${item.nombre}</span>
                        <span class="badge-estado ${clase}">
                            <span class="material-symbols-outlined" style="font-size:16px;">${icono}</span>
                            ${texto}
                        </span>
                    `;
                    listaAsistentesEl.appendChild(div);
                });

                activarAnimacionIconos();
            });
        }

        // Guardado Global en Firebase
        async function guardarRespuestaFirebase(nombre, estado) {
            if (!nombre || !nombre.trim() || !idE) return;
            const nombreLimpio = nombre.trim();
            
            // Clave única basada en el nombre en minúsculas para evitar duplicados
            const idUsuario = nombreLimpio.toLowerCase().replace(/[^a-z0-9]/g, '_');
            const registroRef = ref(db, `asistencias/${idE}/${idUsuario}`);

            try {
                await set(registroRef, {
                    nombre: nombreLimpio,
                    estado: estado
                });
            } catch (err) {
                console.error("Error guardando en Firebase:", err);
                alert("No se pudo registrar la asistencia. Verifica tu conexión.");
            }
        }

        async function tieneGrabacionAudio(nombreCancion) {
            if (!nombreCancion) return false;
            const nombreLimpio = nombreCancion
                .replace(/\(.*?\)/g, '')
                .replace(/-/g, '')
                .replace(/\s+/g, ' ')
                .trim();
            const nombreEncoded = encodeURIComponent(nombreLimpio);

            for (const ext of FORMATOS_AUDIO) {
                try {
                    const res = await fetch(`Grabaciones/${nombreEncoded}.${ext}`, { method: 'HEAD' });
                    if (res.ok) return true;
                } catch (_) {}
            }
            return false;
        }

        async function init() {
            if (!idE) {
                tituloEventoEl.textContent = "Error";
                contenedorDetalleEl.innerHTML = "<div class='cargando'>No se especificó un identificador de evento.</div>";
                return;
            }

            try {
                const resEvents = await fetch('json/eventos.json');
                if (!resEvents.ok) throw new Error("No se pudo cargar eventos.json");
                const eventos = await resEvents.json();

                const evento = eventos.find(e => e.idE === idE);
                if (!evento) {
                    tituloEventoEl.textContent = "Evento no encontrado";
                    contenedorDetalleEl.innerHTML = "<div class='cargando'>El evento solicitado no existe.</div>";
                    return;
                }

                tituloEventoEl.textContent = evento.titulo;

                const tieneLugarTexto = evento.lugar && evento.lugar.trim() !== '';
                const tieneLugarLink = evento.linkLugar && evento.linkLugar.trim() !== '';

                let htmlLugar = '<span>—</span>';
                if (tieneLugarTexto && tieneLugarLink) {
                    htmlLugar = `<a href="${normalizarUrl(evento.linkLugar)}" target="_blank" rel="noopener noreferrer" class="link-lugar">${evento.lugar}</a>`;
                } else if (tieneLugarLink) {
                    htmlLugar = `<a href="${normalizarUrl(evento.linkLugar)}" target="_blank" rel="noopener noreferrer" class="link-lugar">Ver ubicación en mapa</a>`;
                } else if (tieneLugarTexto) {
                    htmlLugar = `<span>${evento.lugar}</span>`;
                }

                const textoNota = (evento.notas || evento.nota || '').toString().trim();
                let htmlNotas = '';
                if (textoNota) {
                    htmlNotas = `
                        <div class="bloque-notas">
                            <span class="material-symbols-outlined">sticky_note_2</span>
                            <div><strong>Nota:</strong> ${textoNota}</div>
                        </div>
                    `;
                }

                let htmlDetalle = `
                    <div class="tarjeta-detalle-evento">
                        <div class="item-info">
                            <span class="material-symbols-outlined">schedule</span>
                            <div class="item-info-contenido">
                                <span class="item-info-etiqueta">Fecha y Hora</span>
                                <span>${formatearFechaYHorarioDetalle(evento.fecha, evento.horaInicio, evento.horaFin)}</span>
                            </div>
                        </div>

                        <div class="item-info">
                            <span class="material-symbols-outlined">checkroom</span>
                            <div class="item-info-contenido">
                                <span class="item-info-etiqueta">Vestimenta</span>
                                <span>${evento.vestimenta || '—'}</span>
                            </div>
                        </div>

                        <div class="item-info">
                            <span class="material-symbols-outlined">location_on</span>
                            <div class="item-info-contenido">
                                <span class="item-info-etiqueta">Lugar</span>
                                ${htmlLugar}
                            </div>
                        </div>

                        ${htmlNotas}
                    </div>
                `;

                contenedorDetalleEl.innerHTML = htmlDetalle;
                seccionAsistenciaEl.style.display = 'flex';
                
                // Conectar lista en vivo desde Firebase
                conectarAsistenciasFirebase();
                activarAnimacionIconos();

                btnAbrirRsvp.onclick = () => {
                    modalRsvp.classList.add('activo');
                    inputNombreRsvp.focus();
                };

                btnCancelarRsvp.onclick = () => {
                    modalRsvp.classList.remove('activo');
                    inputNombreRsvp.value = '';
                };

                btnAsistirRsvp.onclick = async () => {
                    if (!inputNombreRsvp.value.trim()) return;
                    await guardarRespuestaFirebase(inputNombreRsvp.value, 'asistira');
                    modalRsvp.classList.remove('activo');
                    inputNombreRsvp.value = '';
                };

                btnFaltarRsvp.onclick = async () => {
                    if (!inputNombreRsvp.value.trim()) return;
                    await guardarRespuestaFirebase(inputNombreRsvp.value, 'no_asistira');
                    modalRsvp.classList.remove('activo');
                    inputNombreRsvp.value = '';
                };

                if (Array.isArray(evento.canciones) && evento.canciones.length > 0) {
                    const todasLasCanciones = await obtenerCanciones();
                    const cancionesEvento = todasLasCanciones.filter(c => 
                        evento.canciones.some(id => String(id) === String(c.idC))
                    );

                    if (cancionesEvento.length > 0) {
                        listaRepertorioEl.innerHTML = '';
                        const fragmento = document.createDocumentFragment();
                        const numColumnas = obtenerNumColumnas();

                        cancionesEvento.forEach((cancion, indice) => {
                            const fila = document.createElement('div');
                            fila.className = "fila-cancion";

                            const numFila = Math.floor(indice / numColumnas);
                            const numCol = indice % numColumnas;
                            const pasoDiagonal = numFila + numCol;

                            fila.style.animationDelay = `${pasoDiagonal * 0.025}s`;

                            fila.addEventListener('animationend', () => {
                                fila.style.animation = 'none';
                                fila.style.opacity = '1';
                            });

                            fila.onclick = () => {
                                window.location.href = `visor?idC=${encodeURIComponent(cancion.idC)}`;
                            };

                            const claseEstado = cancion.estado || 'terminada';
                            const tituloEstado = {
                                terminada: 'Canción terminada',
                                revisar: 'Hay que revisarla',
                                pendiente: 'Canción no terminada'
                            }[claseEstado] || '';

                            const etiquetaMeta = (cancion.categoria === 'general') ? 'Artista' : 'Arreglos';

                            fila.innerHTML = `
                                <h2>
                                    <span>${cancion.nombreC}</span>
                                    <span class="contenedor-iconos-header">
                                        <span class="estado-icono ${claseEstado}" title="${tituloEstado}"></span>
                                    </span>
                                </h2>
                                <div class="meta">
                                    <span>${etiquetaMeta}: ${cancion.arreglos || '—'}</span>
                                    <span>Tonalidad: <span class="tonalidad-valor">…</span></span>
                                </div>
                            `;
                            fragmento.appendChild(fila);

                            const spanTonalidad = fila.querySelector('.tonalidad-valor');
                            const contenedorIconos = fila.querySelector('.contenedor-iconos-header');

                            obtenerContenidoCancion(cancion.idC)
                                .then(datos => {
                                    const contenidoTexto = typeof datos === 'string' ? datos : (datos?.contenido || '');
                                    const tonDetectada = detectarTonalidad(contenidoTexto);
                                    spanTonalidad.textContent = tonDetectada ? nombreTonalidad(tonDetectada) : '—';
                                })
                                .catch(() => { spanTonalidad.textContent = '—'; });

                            tieneGrabacionAudio(cancion.nombreC).then(tieneAudio => {
                                if (tieneAudio) {
                                    contenedorIconos.insertAdjacentHTML('afterbegin',
                                        `<span class="material-symbols-outlined icono-grabacion" title="Grabación de audio disponible">play_circle</span>`);
                                    activarAnimacionIconos();
                                }
                            });
                        });

                        listaRepertorioEl.appendChild(fragmento);
                        seccionRepertorioEl.style.display = 'block';
                        activarAnimacionIconos();
                    }
                }

            } catch (err) {
                console.error(err);
                contenedorDetalleEl.innerHTML = "<div class='cargando'>Error al cargar los detalles del evento.</div>";
            }
        }

        init();
    </script>
</body>
</html>
