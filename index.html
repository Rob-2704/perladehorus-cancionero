<!DOCTYPE html>
<html lang="es-mx">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="img/icono.png">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sono:MONO@0..1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0&display=swap" />
    <link rel="stylesheet" href="style.css">
    <title>Cancionero - Rondalla Perla De Horus</title>
</head>
<body>
    <div class="container">
        <div class="header-superior">
            <h1>Cancionero Digital</h1>
            <a href="admin.html" class="btn-volver-admin">Panel Admin</a>
        </div>
        <div class="info-cabecera">
            <h2>Rondalla Perla De Horus</h2>
        </div>
        <div class="workspace">
            <div id="lista-canciones">Cargando canciones...</div>
        </div>
    </div>
    <script type="module">
        import { obtenerCanciones } from './js/core-app.js';
        async function cargar() {
            const canciones = await obtenerCanciones();
            const cont = document.getElementById('lista-canciones');
            if (!canciones.length) { cont.textContent = 'No hay canciones cargadas.'; return; }
            cont.innerHTML = canciones.map(c => `<p><a href="visor.html?idC=${c.idC}">${c.nombreC}</a></p>`).join('');
        }
        cargar();
    </script>
</body>
</html>
