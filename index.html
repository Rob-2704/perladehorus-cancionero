<!DOCTYPE html>
<html lang="es-mx">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/x-icon" href="img/icono.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sono:MONO@0..1&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0&display=swap" />

    <link href="style.css" rel="stylesheet">
    <title>Cancionero</title>
    <style>
        body {
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70%;
            height: 70%;
            background-image: url('img/fondo.png');
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            opacity: 0.18;
            pointer-events: none;
            z-index: 0;
        }

        header, main {
            position: relative;
            z-index: 1;
        }

        header {
            max-width: 1000px;
            margin: 0 auto 30px auto;
        }

        h1 {
            margin: 0;
            font-size: 40px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 32px;
            }
        }

        p {
            margin: 5px 0 0 0;
            font-size: 13px;
            color: var(--text-sec);
            border-bottom: 2px solid var(--accent);
            padding-bottom: 10px;
            margin-bottom: 10px;
        }

        /* Configuración de rejilla adaptativa */
        .lista-canciones {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            max-width: 1000px;
            margin: 0 auto;
        }

        @media (min-width: 600px) {
            .lista-canciones {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (min-width: 900px) {
            .lista-canciones {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .fila-cancion {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 16px 20px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            transition: transform 0.15s, box-shadow 0.15s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.15s;
        }
        
        @media (hover: hover) {
            .fila-cancion:hover {
                transform: scale(1.05);
            }
        }
        
        .fila-cancion:active {
            transform: scale(1.05);
        }

        .fila-cancion h2 {
            margin: 0 0 12px 0;
            padding-bottom: 8px;
            font-size: 18px;
            font-weight: 600;
            border-bottom: 2px solid var(--accent);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .contenedor-iconos-header {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .icono-grabacion {
            font-family: 'Material Symbols Outlined' !important;
            font-size: 20px;
            color: var(--accent);
            user-select: none;
            font-weight: normal !important;
            font-style: normal !important;
            font-feature-settings: 'liga';
            -webkit-font-feature-settings: 'liga';
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24 !important;
        }

        /* Estilos para el icono de estado */
        .estado-icono {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .estado-icono.terminada {
            background-color: #2ec4b6;
            box-shadow: 0 0 8px rgba(46, 196, 182, 0.5);
        }

        .estado-icono.revisar {
            background-color: #f5c518;
            box-shadow: 0 0 8px rgba(245, 197, 24, 0.5);
        }

        .estado-icono.pendiente {
            background-color: #e71d36;
            box-shadow: 0 0 8px rgba(231, 29, 54, 0.5);
        }

        .fila-cancion .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            font-size: 13px;
            color: var(--text-sec);
        }

        .cargando {
            text-align: center;
            color: var(--accent);
            padding: 40px;
            font-family: 'Sono', monospace;
            grid-column: 1 / -1;
        }

        @media (max-width: 1300px) {
            body { 
                padding-left: 5px;
                padding-right: 5px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Cancionero</h1>
        <p>Selecciona una canción.</p>
    </header>

    <main id="lista-canciones" class="lista-canciones">
        <div class="cargando">Cargando canciones...</div>
    </main>

    <script type="module">
        import { obtenerCanciones, obtenerContenidoCancion } from './js/api-cliente.js';
        import { detectarTonalidad, nombreTonalidad } from './js/modulo-transponer.js';

        const listaDiv = document.getElementById('lista-canciones');

        const FORMATOS_AUDIO = ['mp3', 'm4a', 'wav', 'ogg', 'aac', 'flac', 'opus', 'webm'];

        // Revisa los formatos de una canción y se detiene en el primero que exista
        async function tieneGrabacionAudio(nombreCancion) {
            if (!nombreCancion) return false;
            const nombreLimpio = nombreCancion
                .replace(/\(.*?\)/g, '')
                .replace(/-/g, '')
                .replace(/\s+/g, ' ')
                .trim();
            const nombreEncoded = encodeURIComponent(nombreLimpio);

            for (const ext of FORMATOS_AUDIO) {
                try {
                    const res = await fetch(`Grabaciones/${nombreEncoded}.${ext}`, { method: 'HEAD' });
                    if (res.ok) return true;
                } catch (_) {}
            }
            return false;
        }

        async function init() {
            try {
                const ORDEN_ESTADO = { terminada: 0, revisar: 1, pendiente: 2 };
                const canciones = (await obtenerCanciones())
                    .slice()
                    .sort((a, b) => (ORDEN_ESTADO[a.estado] ?? 0) - (ORDEN_ESTADO[b.estado] ?? 0));
                listaDiv.innerHTML = "";

                if (canciones.length === 0) {
                    listaDiv.innerHTML = "<div>Todavía no hay canciones registradas.</div>";
                    return;
                }

                const fragmento = document.createDocumentFragment();

                for (const cancion of canciones) {
                    const fila = document.createElement('div');
                    fila.className = "fila-cancion";

                    fila.onclick = () => {
                        window.location.href = `visor?idC=${encodeURIComponent(cancion.idC)}`;
                    };

                    const claseEstado = cancion.estado || 'terminada';
                    const tituloEstado = {
                        terminada: 'Canción terminada',
                        revisar: 'Hay que revisarla',
                        pendiente: 'Canción no terminada'
                    }[claseEstado] || '';

                    fila.innerHTML = `
                        <h2>
                            <span>${cancion.nombreC}</span>
                            <span class="contenedor-iconos-header">
                                <span class="estado-icono ${claseEstado}" title="${tituloEstado}"></span>
                            </span>
                        </h2>
                        <div class="meta">
                            <span>Arreglos: ${cancion.arreglos || '—'}</span>
                            <span>Tonalidad: <span class="tonalidad-valor">…</span></span>
                        </div>
                    `;
                    fragmento.appendChild(fila);

                    // Tonalidad y audio se resuelven en segundo plano, todas las canciones a la vez
                    const spanTonalidad = fila.querySelector('.tonalidad-valor');
                    const contenedorIconos = fila.querySelector('.contenedor-iconos-header');

                    obtenerContenidoCancion(cancion.idC)
                        .then(datos => {
                            spanTonalidad.textContent = datos.contenido
                                ? nombreTonalidad(detectarTonalidad(datos.contenido))
                                : '—';
                        })
                        .catch(() => { spanTonalidad.textContent = '—'; });

                    tieneGrabacionAudio(cancion.nombreC).then(tieneAudio => {
                        if (tieneAudio) {
                            contenedorIconos.insertAdjacentHTML('afterbegin',
                                `<span class="material-symbols-outlined icono-grabacion" title="Grabación de audio disponible">play_circle</span>`);
                        }
                    });
                }

                // Las tarjetas aparecen de inmediato
                listaDiv.appendChild(fragmento);
            } catch (err) {
                listaDiv.innerHTML = "<div class='cargando'>Error al cargar el cancionero.</div>";
            }
        }

        init();
    </script>
</body>
</html>
