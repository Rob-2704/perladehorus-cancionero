<!DOCTYPE html>
<html lang="es-mx">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/x-icon" href="img/icono.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sono:MONO@0..1&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0&display=swap" />

    <link href="style.css" rel="stylesheet">
    <title>Cancionero</title>
    <style>
        body {
            position: relative;
            max-width: 80%;
            margin: 0 auto;
        }

        /* Animación Fade In para la imagen de fondo */
        @keyframes fadeInImagen {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 0.18;
            }
        }

        body::before {
            content: "";
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70%;
            height: 70%;
            background-image: url('img/fondo.png');
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            opacity: 0;
            pointer-events: none;
            z-index: 0;

            will-change: opacity;
            animation: fadeInImagen 0.6s ease-out forwards;
        }

        /* Aislamiento de capas para evitar que las animaciones 3D de las tarjetas sobrepasen el encabezado */
        header {
            position: relative;
            z-index: 100;
            isolation: isolate;
            margin: 0 auto 30px auto;
        }

        main {
            position: relative;
            z-index: 1;
        }

        h1 {
            margin: 0;
            font-size: 40px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 32px;
            }
        }

        p {
            margin: 5px 0 0 0;
            font-size: 13px;
            color: var(--text-sec);
            border-bottom: 2px solid var(--accent);
            padding-bottom: 10px;
            margin-bottom: 10px;
        }

        /* Desplegable de categoría y Barra de Búsqueda */
        .contenedor-filtro {
            margin: 15px 0 10px 0;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            position: relative;
            z-index: 100;
        }

        .contenedor-busqueda {
            position: relative;
            flex: 1;
            min-width: 200px;
            z-index: 101;
        }

        .select-categoria,
        .input-busqueda {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 2px solid var(--accent);
            border-radius: 12px;
            padding: 8px 16px;
            font-family: 'Sono', monospace;
            font-size: 14px;
            outline: none;
            transition: box-shadow 0.2s, border-color 0.2s;
        }

        .select-categoria {
            cursor: pointer;
        }

        .input-busqueda {
            width: 100%;
            box-sizing: border-box;
        }

        .select-categoria:focus,
        .input-busqueda:focus {
            box-shadow: 0 0 8px rgba(188, 151, 49, 0.4);
        }

        .input-busqueda::placeholder {
            color: var(--text-sec);
            opacity: 0.7;
        }

        /* Menú flotante de sugerencias superpuesto */
        .lista-sugerencias {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            background-color: var(--card-bg);
            border: 2px solid var(--accent);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            z-index: 9999;
            max-height: 240px;
            overflow-y: auto;
            display: none;
        }

        .lista-sugerencias.activa {
            display: block;
        }

        .item-sugerencia {
            padding: 10px 16px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(188, 151, 49, 0.2);
            transition: background-color 0.15s;
            font-family: 'Sono', monospace;
            font-size: 13px;
            color: var(--text-main);
        }

        .item-sugerencia:last-child {
            border-bottom: none;
        }

        .item-sugerencia:hover {
            background-color: rgba(188, 151, 49, 0.18);
        }

        .item-sugerencia .sugerencia-meta {
            font-size: 11px;
            color: var(--text-sec);
            margin-left: 10px;
            white-space: nowrap;
        }

        /* Configuración de rejilla adaptativa */
        .lista-canciones {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            margin: 0 auto;
        }

        @media (min-width: 600px) {
            .lista-canciones {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (min-width: 900px) {
            .lista-canciones {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (min-width: 1200px) {
            .lista-canciones {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        /* Animación instantánea estilo Nintendo 3DS / Wii U para tarjetas */
        @keyframes popWiiU {
            0% {
                opacity: 0;
                transform: translate(-15px, -15px) scale(0.75);
            }
            75% {
                opacity: 1;
                transform: translate(2px, 2px) scale(1.03);
            }
            100% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
        }

        /* Animación fluida con rebote elástico para el icono de play */
        @keyframes popIconoPlay {
            0% {
                opacity: 0;
                transform: scale(0.2);
            }
            70% {
                opacity: 1;
                transform: scale(1.2);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .fila-cancion {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 16px 20px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            transition: transform 0.05s, box-shadow 0.15s;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            -webkit-tap-highlight-color: transparent;
            
            opacity: 0;
            will-change: transform, opacity;
            animation: popWiiU 0.22s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        
        @media (hover: hover) {
            .fila-cancion:hover {
                transform: scale(1.05);
            }
        }
        
        .fila-cancion:active {
            transform: scale(1.05);
        }

        .fila-cancion h2 {
            margin: 0 0 12px 0;
            gap: 10px;
            padding-bottom: 8px;
            font-size: 18px;
            font-weight: 600;
            border-bottom: 2px solid var(--accent);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .contenedor-iconos-header {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .icono-grabacion {
            font-family: 'Material Symbols Outlined' !important;
            font-size: 20px;
            color: var(--accent);
            user-select: none;
            font-weight: normal !important;
            font-style: normal !important;
            font-feature-settings: 'liga';
            -webkit-font-feature-settings: 'liga';
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24 !important;
            
            /* Aplicación de animación al aparecer dinámicamente */
            opacity: 0;
            will-change: transform, opacity;
            animation: popIconoPlay 0.25s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        /* Estilos para el icono de estado */
        .estado-icono {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .estado-icono.terminada {
            background-color: #2ec4b6;
            box-shadow: 0 0 8px rgba(46, 196, 182, 0.5);
        }

        .estado-icono.revisar {
            background-color: #f5c518;
            box-shadow: 0 0 8px rgba(245, 197, 24, 0.5);
        }

        .estado-icono.pendiente {
            background-color: #e71d36;
            box-shadow: 0 0 8px rgba(231, 29, 54, 0.5);
        }

        .fila-cancion .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            font-size: 13px;
            color: var(--text-sec);
        }

        .cargando {
            text-align: center;
            color: var(--accent);
            padding: 40px;
            font-family: 'Sono', monospace;
            grid-column: 1 / -1;
        }

        @media (max-width: 1300px) {
            body { 
                padding-left: 23px;
                padding-right: 23px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Cancionero</h1>
        <p>Selecciona una canción.</p>
        <div class="contenedor-filtro">
            <select id="select-categoria" class="select-categoria">
                <option value="rondalla">Rondalla</option>
                <option value="general">General</option>
            </select>
            <div class="contenedor-busqueda">
                <input type="text" id="input-busqueda" class="input-busqueda" placeholder="Buscar canción o arreglos..." autocomplete="off">
                <div id="lista-sugerencias" class="lista-sugerencias"></div>
            </div>
        </div>
    </header>

    <main id="lista-canciones" class="lista-canciones">
        <div class="cargando"></div>
    </main>

    <script type="module">
        import { obtenerCanciones, obtenerContenidoCancion } from './js/api-cliente.js';
        import { detectarTonalidad, nombreTonalidad } from './js/modulo-transponer.js';

        const listaDiv = document.getElementById('lista-canciones');
        const selectCategoria = document.getElementById('select-categoria');
        const inputBusqueda = document.getElementById('input-busqueda');
        const contenedorBusqueda = document.querySelector('.contenedor-busqueda');
        const listaSugerencias = document.getElementById('lista-sugerencias');

        const FORMATOS_AUDIO = ['mp3', 'm4a', 'wav', 'ogg', 'aac', 'flac', 'opus', 'webm'];
        let cancionesGlobal = [];

        function obtenerNumColumnas() {
            const ancho = window.innerWidth;
            if (ancho >= 1200) return 4;
            if (ancho >= 900) return 3;
            if (ancho >= 600) return 2;
            return 1;
        }

        async function tieneGrabacionAudio(nombreCancion) {
            if (!nombreCancion) return false;
            const nombreLimpio = nombreCancion
                .replace(/\(.*?\)/g, '')
                .replace(/-/g, '')
                .replace(/\s+/g, ' ')
                .trim();
            const nombreEncoded = encodeURIComponent(nombreLimpio);

            for (const ext of FORMATOS_AUDIO) {
                try {
                    const res = await fetch(`Grabaciones/${nombreEncoded}.${ext}`, { method: 'HEAD' });
                    if (res.ok) return true;
                } catch (_) {}
            }
            return false;
        }

        function mostrarSugerencias() {
            const textoBusqueda = inputBusqueda.value.toLowerCase().trim();
            const categoriaSeleccionada = selectCategoria.value;
            const etiquetaMeta = categoriaSeleccionada === 'general' ? 'Artista' : 'Arreglos';

            if (!textoBusqueda) {
                listaSugerencias.classList.remove('activa');
                listaSugerencias.innerHTML = '';
                return;
            }

            const coincidencias = cancionesGlobal.filter(c => {
                const coincideCategoria = (c.categoria || 'rondalla') === categoriaSeleccionada;
                const coincideNombre = (c.nombreC || '').toLowerCase().includes(textoBusqueda);
                const coincideArreglos = (c.arreglos || '').toLowerCase().includes(textoBusqueda);
                return coincideCategoria && (coincideNombre || coincideArreglos);
            }).slice(0, 6);

            if (coincidencias.length === 0) {
                listaSugerencias.classList.remove('activa');
                listaSugerencias.innerHTML = '';
                return;
            }

            listaSugerencias.innerHTML = '';
            coincidencias.forEach(cancion => {
                const div = document.createElement('div');
                div.className = 'item-sugerencia';
                div.innerHTML = `
                    <span>${cancion.nombreC}</span>
                    <span class="sugerencia-meta">${cancion.arreglos ? `${etiquetaMeta}:${cancion.arreglos}` : ''}</span>
                `;
                div.onclick = (e) => {
                    e.stopPropagation();
                    inputBusqueda.value = cancion.nombreC;
                    listaSugerencias.classList.remove('activa');
                    renderizarLista();
                };
                listaSugerencias.appendChild(div);
            });

            listaSugerencias.classList.add('activa');
        }

        function renderizarLista() {
            const categoriaSeleccionada = selectCategoria.value;
            const textoBusqueda = inputBusqueda.value.toLowerCase().trim();
            const etiquetaMeta = categoriaSeleccionada === 'general' ? 'Artista' : 'Arreglos';

            listaDiv.innerHTML = "";

            const filtradas = cancionesGlobal.filter(c => {
                const coincideCategoria = (c.categoria || 'rondalla') === categoriaSeleccionada;
                const coincideNombre = (c.nombreC || '').toLowerCase().includes(textoBusqueda);
                const coincideArreglos = (c.arreglos || '').toLowerCase().includes(textoBusqueda);
                return coincideCategoria && (coincideNombre || coincideArreglos);
            });

            if (filtradas.length === 0) {
                listaDiv.innerHTML = "<div class='cargando'>No se encontraron canciones.</div>";
                return;
            }

            const fragmento = document.createDocumentFragment();
            const numColumnas = obtenerNumColumnas();

            filtradas.forEach((cancion, indice) => {
                const fila = document.createElement('div');
                fila.className = "fila-cancion";

                const numFila = Math.floor(indice / numColumnas);
                const numCol = indice % numColumnas;
                const pasoDiagonal = numFila + numCol;
                
                fila.style.animationDelay = `${pasoDiagonal * 0.025}s`;

                fila.addEventListener('animationend', () => {
                    fila.style.animation = 'none';
                    fila.style.opacity = '1';
                });

                fila.onclick = () => {
                    window.location.href = `visor?idC=${encodeURIComponent(cancion.idC)}`;
                };

                const claseEstado = cancion.estado || 'terminada';
                const tituloEstado = {
                    terminada: 'Canción terminada',
                    revisar: 'Hay que revisarla',
                    pendiente: 'Canción no terminada'
                }[claseEstado] || '';

                fila.innerHTML = `
                    <h2>
                        <span>${cancion.nombreC}</span>
                        <span class="contenedor-iconos-header">
                            <span class="estado-icono ${claseEstado}" title="${tituloEstado}"></span>
                        </span>
                    </h2>
                    <div class="meta">
                        <span>${etiquetaMeta}: ${cancion.arreglos || '—'}</span>
                        <span>Tonalidad: <span class="tonalidad-valor">…</span></span>
                    </div>
                `;
                fragmento.appendChild(fila);

                const spanTonalidad = fila.querySelector('.tonalidad-valor');
                const contenedorIconos = fila.querySelector('.contenedor-iconos-header');

                obtenerContenidoCancion(cancion.idC)
                    .then(datos => {
                        spanTonalidad.textContent = datos.contenido
                            ? nombreTonalidad(detectarTonalidad(datos.contenido))
                            : '—';
                    })
                    .catch(() => { spanTonalidad.textContent = '—'; });

                tieneGrabacionAudio(cancion.nombreC).then(tieneAudio => {
                    if (tieneAudio) {
                        contenedorIconos.insertAdjacentHTML('afterbegin',
                            `<span class="material-symbols-outlined icono-grabacion" title="Grabación de audio disponible">play_circle</span>`);
                    }
                });
            });

            listaDiv.appendChild(fragmento);
        }

        async function init() {
            try {
                const ORDEN_ESTADO = { terminada: 0, revisar: 1, pendiente: 2 };
                cancionesGlobal = (await obtenerCanciones())
                    .slice()
                    .sort((a, b) => (ORDEN_ESTADO[a.estado] ?? 0) - (ORDEN_ESTADO[b.estado] ?? 0));

                selectCategoria.addEventListener('change', () => {
                    listaSugerencias.classList.remove('activa');
                    renderizarLista();
                });

                inputBusqueda.addEventListener('input', () => {
                    renderizarLista();
                    mostrarSugerencias();
                });

                inputBusqueda.addEventListener('focus', mostrarSugerencias);

                document.addEventListener('click', (e) => {
                    if (!contenedorBusqueda.contains(e.target)) {
                        listaSugerencias.classList.remove('activa');
                    }
                });

                renderizarLista();
            } catch (err) {
                listaDiv.innerHTML = "<div class='cargando'>Error al cargar el cancionero.</div>";
            }
        }

        init();
    </script>
</body>
</html>
