<!DOCTYPE html>
<html lang="es-mx">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="img/icono.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sono:MONO@0..1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0&display=swap" />
    <link href="style.css" rel="stylesheet">
    <title>Gestor de Canciones</title>
    <style>
        body { max-width: 80%; margin: 0 auto; font-family: 'Sono', monospace; }
        header { margin-bottom: 20px; border-bottom: 2px solid var(--accent); padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        h1 { margin: 0; font-size: 32px; font-weight: 700; }
        .btn-crear { background-color: var(--accent); color: var(--bg-color); border: none; padding: 10px 18px; border-radius: 12px; font-family: 'Sono', monospace; font-size: 14px; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; transition: transform 0.15s, box-shadow 0.15s; }
        .btn-crear:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(188, 151, 49, 0.4); }
        .contenedor-busqueda { margin: 15px 0 20px 0; width: 100%; }
        .input-busqueda { width: 100%; background-color: var(--card-bg); color: var(--text-main); border: 2px solid var(--accent); border-radius: 12px; padding: 10px 16px; font-family: 'Sono', monospace; font-size: 14px; outline: none; box-sizing: border-box; }
        .grid-canciones { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
        .tarjeta-cancion-admin { background-color: var(--card-bg); border-radius: 16px; padding: 16px; border: 2px solid transparent; display: flex; flex-direction: column; justify-content: space-between; gap: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); transition: border-color 0.2s, transform 0.15s; }
        .tarjeta-cancion-admin:hover { border-color: var(--accent); transform: translateY(-2px); }
        .tarjeta-cancion-admin h3 { margin: 0; font-size: 18px; color: var(--text-main); }
        .tarjeta-cancion-admin .meta { font-size: 12px; color: var(--text-sec); display: flex; flex-direction: column; gap: 4px; }
        .btn-editar-cancion { background-color: #2ec4b6; color: #0b1315; border: none; border-radius: 10px; padding: 8px 14px; font-family: 'Sono', monospace; font-size: 13px; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; transition: transform 0.15s; }
        .btn-editar-cancion:active { transform: scale(0.96); }
        .cargando { text-align: center; color: var(--accent); padding: 40px; grid-column: 1 / -1; }
        @media (max-width: 600px) { body { max-width: 92%; } h1 { font-size: 24px; } }
    </style>
</head>
<body>
    <a href="./" style="color: var(--text-sec); text-decoration: none; font-size: 13px; display: inline-block; margin-top: 20px;">← Volver al inicio</a>
    
    <header>
        <div>
            <h1>Gestión de Canciones</h1>
            <p style="margin: 5px 0 0 0; font-size: 13px; color: var(--text-sec);">Selecciona una canción para editar o crea una nueva</p>
        </div>
        <a href="editor-cancion.html" class="btn-crear">
            <span class="material-symbols-outlined">add</span> Añadir Canción
        </a>
    </header>

    <main>
        <div class="contenedor-busqueda">
            <input type="text" id="input-busqueda" class="input-busqueda" placeholder="Buscar por título o arreglos..." autocomplete="off">
        </div>

        <div id="grid-canciones" class="grid-canciones">
            <div class="cargando">Cargando canciones...</div>
        </div>
    </main>

    <script type="module">
        import { obtenerCanciones } from './js/api-cliente.js';

        const gridCanciones = document.getElementById('grid-canciones');
        const inputBusqueda = document.getElementById('input-busqueda');
        let cancionesGlobal = [];

        function normalizarTexto(txt) {
            return (txt || '').toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
        }

        function renderizarLista() {
            gridCanciones.innerHTML = '';
            const filtro = normalizarTexto(inputBusqueda.value);

            const filtradas = cancionesGlobal.filter(c => {
                const nombre = normalizarTexto(c.nombreC);
                const arreglos = normalizarTexto(c.arreglos);
                return nombre.includes(filtro) || arreglos.includes(filtro);
            });

            if (filtradas.length === 0) {
                gridCanciones.innerHTML = '<div class="cargando">No se encontraron canciones.</div>';
                return;
            }

            filtradas.forEach(cancion => {
                const tarjeta = document.createElement('div');
                tarjeta.className = 'tarjeta-cancion-admin';
                tarjeta.innerHTML = `
                    <div>
                        <h3>${cancion.nombreC}</h3>
                        <div class="meta" style="margin-top:6px;">
                            <span>Arreglos: ${cancion.arreglos || '—'}</span>
                            <span>Categoría: ${cancion.categoria || 'rondalla'}</span>
                        </div>
                    </div>
                    <a href="editor-cancion.html?idC=${encodeURIComponent(cancion.idC)}" class="btn-editar-cancion">
                        <span class="material-symbols-outlined" style="font-size:16px;">edit</span> Editar Canción
                    </a>
                `;
                gridCanciones.appendChild(tarjeta);
            });
        }

        async function init() {
            try {
                cancionesGlobal = await obtenerCanciones();
                renderizarLista();
                inputBusqueda.addEventListener('input', renderizarLista);
            } catch (err) {
                gridCanciones.innerHTML = '<div class="cargando">Error al cargar canciones.</div>';
            }
        }

        init();
    </script>
</body>
</html>
